apiVersion: platform.processmanager.dev/v1
kind: ProjectRegistration
metadata:
  name: alpha
spec:
  project: alpha
  repository:
    forgejoOwner: org
    forgejoName: shared-repo
    defaultBranch: main
  buildContract:
    path: .platform/build.yaml
    version: 1
  registryNamespace: projects/alpha
  platform: linux/amd64
  deploymentPath: applications/alpha
  runtimePolicy:
    accessPolicy: public
  automaticDelivery: true
