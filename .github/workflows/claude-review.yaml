name: Claude Review

# Event-driven review: a session starts when a PR or issue is created.
# Rules live in REVIEW.md (severity tags, nit cap, file:line evidence,
# summary header, 3-round cap, skipped paths). This workflow only triggers.
#
# Auth: Claude subscription OAuth token (run `claude setup-token` locally,
# store as repo secret CLAUDE_CODE_OAUTH_TOKEN).

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]
    branches: [main]
    paths-ignore:
      - "deploy/platform/cert-manager/upstream/**"
      - "deploy/platform/cni/upstream/**"
      - "**/gotk-components.yaml"
      - "backups/**"
  issues:
    types: [opened]

concurrency:
  group: claude-review-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: true

jobs:
  pr-review:
    name: claude-pr-review
    if: >-
      github.event_name == 'pull_request' &&
      !github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          track_progress: true
          prompt: |
            REPO: ${{ github.repository }}
            PR: #${{ github.event.pull_request.number }}
            EVENT ACTION: ${{ github.event.action }}

            Review this pull request. Read and follow REVIEW.md, AGENTS.md and
            .specify/memory/constitution.md exactly.

            Process:
            1. Read the PR title/description to learn its intent. For bug fixes,
               look for the root cause, not just the symptom.
            2. Review the diff against the whole repo, not the diff alone.
            3. Verify every candidate finding before posting: re-read the
               surrounding code and discard anything you cannot prove with a
               concrete failure mechanism. Drop style, naming and diagnostic noise.
            4. Rounds: if this is the first review (action opened/reopened/
               ready_for_review) review the full diff. On `synchronize`, review only
               the new commits plus still-open threads, and do not repeat findings
               already resolved at the same location. If you have already reviewed
               this PR 3 times, say so and ask the author to reconsider the approach.
            5. Post inline comments only for surviving findings, each tagged
               Important, Security, Nit (max 2) or Pre-existing, each with file:line.
            6. Post one summary comment that starts with exactly:
               `N Important, N Security, N Nit, N Pre-existing`
               and states plainly when nothing blocking needs fixing.

            You are not a human approver: never approve the PR.
          claude_args: |
            --max-turns 25
            --allowedTools "Read,Grep,Glob,Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(gh pr view:*),Bash(gh pr diff:*),mcp__github_inline_comment__create_inline_comment"

  issue-triage:
    name: claude-issue-triage
    if: github.event_name == 'issues' && github.event.issue.user.type != 'Bot'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            ISSUE: #${{ github.event.issue.number }}

            Triage this new issue using AGENTS.md and the architecture handbook
            for context. Post ONE comment that:
            - restates the problem in one sentence,
            - names the subsystem(s) and files most likely involved (cite file paths
              you actually opened),
            - lists missing information needed to act, if any,
            - flags any constitutional invariant it touches.
            Do not edit code, open PRs, or change labels.
          claude_args: |
            --max-turns 10
            --allowedTools "Read,Grep,Glob,Bash(gh issue view:*),Bash(gh issue comment:*)"
