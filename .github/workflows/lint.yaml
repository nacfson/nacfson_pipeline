name: Lint & Validation

on:
  push:
    branches: ["*"]
  pull_request:
    branches: ["*"]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Verify Go Gateway builds and tests pass
        run: |
          cd gateway
          go test -v ./...
          go vet ./...

      - name: ShellCheck linting
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: './scripts'

      - name: Validate Kubernetes Manifests YAML
        uses: ibiqlik/action-yamllint@v3
        with:
          file_or_dir: 'deploy/ clusters/'
          config_data: |
            extends: default
            rules:
              line-length: disable
              truthy: disable
              document-start: disable

  bootstrap-syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned controller dependencies
        run: |
          pip install --upgrade pip
          pip install -r bootstrap/requirements.txt

      - name: Ansible playbook syntax check
        run: |
          ansible-playbook -i 'syntax-check-vm,' -u ubuntu -e 'k3s_version=v1.35.9+k3s1' -e 'gitops_environment=local-k3s' bootstrap/bootstrap.yml --syntax-check

