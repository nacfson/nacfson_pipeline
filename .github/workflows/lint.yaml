name: Lint & Validation

on:
  push:
    branches: ["*"]
  pull_request:
    branches: ["*"]
  merge_group:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Verify Go Gateway builds and tests pass
        run: |
          cd gateway
          go test -v ./...
          go vet ./...

      - name: Verify Go Debug MCP builds and tests pass
        run: |
          cd services/debug-mcp
          go test -race -v ./...
          go vet ./...

      - name: ShellCheck linting
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: './scripts'
          version: v0.11.0

      - name: Validate Kubernetes Manifests YAML
        uses: ibiqlik/action-yamllint@v3
        with:
          file_or_dir: 'deploy/ clusters/'
          config_data: |
            extends: default
            ignore: |
              **/gotk-components.yaml
              deploy/platform/cert-manager/upstream/
              deploy/platform/cni/upstream/
            rules:
              line-length: disable
              truthy: disable
              document-start: disable

  bootstrap-syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned controller dependencies
        run: |
          pip install --upgrade pip
          pip install -r bootstrap/requirements.txt

      - name: Ansible playbook syntax check
        run: |
          ansible-playbook -i 'syntax-check-vm,' -u ubuntu -e 'k3s_version=v1.35.9+k3s1' -e 'gitops_environment=local-k3s' bootstrap/bootstrap.yml --syntax-check

  lua-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install LuaJIT
        run: sudo apt-get update && sudo apt-get install -y luajit

      - name: Run Lua log contract tests
        run: |
          if [ -f tests/observability/lua/run_log_contract_tests.lua ]; then
            luajit tests/observability/lua/run_log_contract_tests.lua
          else
            echo "Skipping Lua log contract tests: test suite not present in this commit"
          fi


  terraform-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Read pinned Terraform version
        id: tfver
        run: echo "version=$(cat infra/gcp/.terraform-version)" >> "$GITHUB_OUTPUT"

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_version: ${{ steps.tfver.outputs.version }}
          terraform_wrapper: false

      - name: Format, init (no backend) and validate each root
        run: |
          for root in bootstrap project gke; do
            echo "::group::infra/gcp/${root}"
            terraform -chdir="infra/gcp/${root}" fmt -check -recursive
            terraform -chdir="infra/gcp/${root}" init -backend=false -lockfile=readonly -input=false
            terraform -chdir="infra/gcp/${root}" validate
            echo "::endgroup::"
          done
          echo "::group::infra/oci/terraform"
          terraform -chdir=infra/oci/terraform fmt -check -recursive
          terraform -chdir=infra/oci/terraform init -backend=false -lockfile=readonly -input=false
          terraform -chdir=infra/oci/terraform validate
          echo "::endgroup::"

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cross-check shared values with clusters/gke
        run: |
          pip install -r scripts/ci/requirements-preflight.txt
          python3 scripts/ci/check-gcp-shared-values.py

  kafka-declarations:
    runs-on: ubuntu-latest
    env:
      KUBECONFORM_VERSION: "v0.6.7"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install -r scripts/ci/requirements-preflight.txt
          curl -sL https://github.com/yannh/kubeconform/releases/download/${{ env.KUBECONFORM_VERSION }}/kubeconform-linux-amd64.tar.gz | sudo tar -xz -C /usr/local/bin kubeconform

      - name: Check declarations
        run: python3 scripts/ci/kafka-declarations.py check

      - name: Declaration tests
        run: python3 -m unittest discover tests/infra

      - name: Committed renders are current
        run: |
          python3 scripts/ci/kafka-declarations.py render --target ansible
          python3 scripts/ci/kafka-declarations.py render --target compose
          changed=$(git status --porcelain -- infra/oci/ansible/group_vars/all/kafka.generated.yml tests/kafka/rehearsal/)
          if [ -n "$changed" ]; then echo "$changed"; git diff; exit 1; fi

  oci-ansible:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned Ansible tools and collections
        run: |
          pip install -r bootstrap/requirements.txt ansible-lint==26.10.1
          ansible-galaxy collection install -r infra/oci/ansible/requirements.yml

      - name: Syntax check every playbook
        working-directory: infra/oci/ansible
        run: |
          for pb in *.yml; do
            [ "$pb" = requirements.yml ] && continue
            ansible-playbook --syntax-check "$pb"
          done

      - name: ansible-lint
        working-directory: infra/oci/ansible
        run: ansible-lint --offline .

  kafka-go-services:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.9'

      - name: wg-slot-agent
        working-directory: services/wg-slot-agent
        run: |
          go test ./...
          go vet ./...

      - name: error-pipeline
        working-directory: services/error-pipeline
        run: |
          go test ./...
          go vet ./...
