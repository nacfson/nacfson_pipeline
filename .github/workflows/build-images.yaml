name: Build and Publish Container Images

on:
  push:
    branches: [main]
    paths:
      - "services/vault-proxies/**"
      - "gateway/**"
      - ".github/workflows/build-images.yaml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build & Push Multi-Arch Images
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: vault-db-proxy
            context: services/vault-proxies
            dockerfile: services/vault-proxies/Dockerfile.db-proxy
            image_name: vault-db-proxy
          - name: vault-registry-proxy
            context: services/vault-proxies
            dockerfile: services/vault-proxies/Dockerfile.registry-proxy
            image_name: vault-registry-proxy
          - name: platform-auth-gateway
            context: gateway
            dockerfile: gateway/Dockerfile
            image_name: platform-auth-gateway

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate lowercased image tags
        id: meta
        run: |
          OWNER_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          IMAGE="ghcr.io/${OWNER_LOWER}/${{ matrix.image_name }}"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "tags=${IMAGE}:latest,${IMAGE}:sha-${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
