---
kafka_cluster_id: IzXtKbazRM6ZRcObBw5qXA
kafka_version: 4.3.2
kafka_image: docker.io/apache/kafka:4.3.2@sha256:852a0d49fc4e656b022e7f23785411802c9a088c78a7c5e39f33969de9c227a7
kafka_client_port: 9092
kafka_log4j_opts: -Dlog4j2.configurationFile=/etc/kafka-node/log4j2.yaml
kafka_controller_port: 9093
kafka_bootstrap_servers: 10.200.0.11:9092,10.200.0.12:9092,10.200.0.13:9092
kafka_controller_bootstrap_servers: 10.200.0.11:9093,10.200.0.12:9093,10.200.0.14:9093
kafka_controllers:
  - node_id: 1
    name: a1-1
    address: 10.200.0.11
  - node_id: 2
    name: a1-2
    address: 10.200.0.12
  - node_id: 4
    name: micro-2
    address: 10.200.0.14
kafka_nodes:
  a1-1:
    node_id: 1
    roles:
      - broker
      - controller
    address: 10.200.0.11
    identities:
      - broker-1
      - controller-1
      - ops-agent-a1-1
      - ops-cli
    server_properties:
      node.id: '1'
      process.roles: broker,controller
      listeners: CLIENT://10.200.0.11:9092,CONTROLLER://10.200.0.11:9093
      advertised.listeners: CLIENT://10.200.0.11:9092,CONTROLLER://10.200.0.11:9093
      listener.security.protocol.map: CLIENT:SSL,CONTROLLER:SSL
      controller.listener.names: CONTROLLER
      controller.quorum.bootstrap.servers: 10.200.0.11:9093,10.200.0.12:9093,10.200.0.14:9093
      log.dirs: /var/lib/kafka/data
      ssl.client.auth: required
      ssl.keystore.type: PEM
      ssl.keystore.location: /etc/kafka-node/tls/broker-1.pem
      ssl.truststore.type: PEM
      ssl.truststore.location: /etc/kafka-node/tls/ca.crt
      ssl.principal.mapping.rules: RULE:^CN=([^,]+)$/$1/,DEFAULT
      authorizer.class.name: org.apache.kafka.metadata.authorizer.StandardAuthorizer
      super.users: User:broker-1;User:broker-2;User:broker-3;User:controller-1;User:controller-2;User:controller-4
      inter.broker.listener.name: CLIENT
      listener.name.controller.ssl.keystore.location: /etc/kafka-node/tls/controller-1.pem
      auto.create.topics.enable: 'false'
      compression.type: producer
      allow.everyone.if.no.acl.found: 'false'
      default.replication.factor: '3'
      min.insync.replicas: '2'
    format_args_bootstrap:
      - format
      - --cluster-id
      - IzXtKbazRM6ZRcObBw5qXA
      - --config
      - /etc/kafka-node/server.properties
      - --initial-controllers
      - 1@10.200.0.11:9093:eFwoLaOpTwOL1gI0wJymvA,2@10.200.0.12:9093:49xqtT-RSkOQGsPkD9yruQ,4@10.200.0.14:9093:YkxbiitTRYiC1W3aHMCsLg
    format_args_join:
      - format
      - --cluster-id
      - IzXtKbazRM6ZRcObBw5qXA
      - --config
      - /etc/kafka-node/server.properties
      - --no-initial-controllers
  a1-2:
    node_id: 2
    roles:
