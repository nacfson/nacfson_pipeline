      listeners: CLIENT://10.200.0.12:9092,CONTROLLER://10.200.0.12:9093
      advertised.listeners: CLIENT://10.200.0.12:9092,CONTROLLER://10.200.0.12:9093
      listener.security.protocol.map: CLIENT:SSL,CONTROLLER:SSL
      controller.listener.names: CONTROLLER
      controller.quorum.bootstrap.servers: 10.200.0.11:9093,10.200.0.12:9093,10.200.0.14:9093
      log.dirs: /var/lib/kafka/data
      ssl.client.auth: required
      ssl.keystore.type: PEM
      ssl.keystore.location: /etc/kafka-node/tls/broker-2.pem
      ssl.truststore.type: PEM
      ssl.truststore.location: /etc/kafka-node/tls/ca.crt
      ssl.principal.mapping.rules: RULE:^CN=([^,]+)$/$1/,DEFAULT
      authorizer.class.name: org.apache.kafka.metadata.authorizer.StandardAuthorizer
      super.users: User:broker-1;User:broker-2;User:broker-3;User:controller-1;User:controller-2;User:controller-4
      inter.broker.listener.name: CLIENT
      listener.name.controller.ssl.keystore.location: /etc/kafka-node/tls/controller-2.pem
      auto.create.topics.enable: 'false'
      compression.type: producer
      allow.everyone.if.no.acl.found: 'false'
      default.replication.factor: '3'
      min.insync.replicas: '2'
    format_args_bootstrap:
      - format
      - --cluster-id
      - IzXtKbazRM6ZRcObBw5qXA
      - --config
      - /etc/kafka-node/server.properties
      - --initial-controllers
      - 1@10.200.0.11:9093:eFwoLaOpTwOL1gI0wJymvA,2@10.200.0.12:9093:49xqtT-RSkOQGsPkD9yruQ,4@10.200.0.14:9093:YkxbiitTRYiC1W3aHMCsLg
    format_args_join:
      - format
      - --cluster-id
      - IzXtKbazRM6ZRcObBw5qXA
      - --config
      - /etc/kafka-node/server.properties
      - --no-initial-controllers
  micro-1:
    node_id: 3
    roles:
      - broker
    address: 10.200.0.13
    identities:
      - broker-3
      - ops-agent-micro-1
      - ops-cli
    server_properties:
      node.id: '3'
      process.roles: broker
      listeners: CLIENT://10.200.0.13:9092
      advertised.listeners: CLIENT://10.200.0.13:9092
      listener.security.protocol.map: CLIENT:SSL,CONTROLLER:SSL
      controller.listener.names: CONTROLLER
      controller.quorum.bootstrap.servers: 10.200.0.11:9093,10.200.0.12:9093,10.200.0.14:9093
      log.dirs: /var/lib/kafka/data
      ssl.client.auth: required
      ssl.keystore.type: PEM
      ssl.keystore.location: /etc/kafka-node/tls/broker-3.pem
      ssl.truststore.type: PEM
      ssl.truststore.location: /etc/kafka-node/tls/ca.crt
      ssl.principal.mapping.rules: RULE:^CN=([^,]+)$/$1/,DEFAULT
      authorizer.class.name: org.apache.kafka.metadata.authorizer.StandardAuthorizer
      super.users: User:broker-1;User:broker-2;User:broker-3;User:controller-1;User:controller-2;User:controller-4
      inter.broker.listener.name: CLIENT
      auto.create.topics.enable: 'false'
      compression.type: producer
      allow.everyone.if.no.acl.found: 'false'
      default.replication.factor: '3'
