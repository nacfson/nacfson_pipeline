      - 1@10.200.0.11:9093:eFwoLaOpTwOL1gI0wJymvA,2@10.200.0.12:9093:49xqtT-RSkOQGsPkD9yruQ,4@10.200.0.14:9093:YkxbiitTRYiC1W3aHMCsLg
    format_args_join:
      - format
      - --cluster-id
      - IzXtKbazRM6ZRcObBw5qXA
      - --config
      - /etc/kafka-node/server.properties
      - --no-initial-controllers
kafka_topics:
  - name: logs.proj.valid
    partitions: 3
    replication_factor: 3
    min_insync_replicas: 2
    retention_ms: 604800000
    retention_bytes: 5368709120
    segment_bytes: 134217728
    max_message_bytes: 1048588
    timestamp_type: CreateTime
  - name: logs.proj.quarantine
    partitions: 3
    replication_factor: 3
    min_insync_replicas: 2
    retention_ms: 604800000
    retention_bytes: 1073741824
    segment_bytes: 134217728
    max_message_bytes: 1048588
    timestamp_type: CreateTime
  - name: ops.platform.events
    partitions: 1
    replication_factor: 3
    min_insync_replicas: 1
    retention_ms: 2592000000
    retention_bytes: 268435456
    segment_bytes: 134217728
    max_message_bytes: 1048588
    timestamp_type: LogAppendTime
  - name: ops.platform.metrics
    partitions: 1
    replication_factor: 3
    min_insync_replicas: 1
    retention_ms: 604800000
    retention_bytes: 268435456
    segment_bytes: 134217728
    max_message_bytes: 1048588
    timestamp_type: LogAppendTime
kafka_identities:
  - name: broker-1
    key_location: vm:a1-1
    super_user: true
    grants: []
  - name: broker-2
    key_location: vm:a1-2
    super_user: true
    grants: []
  - name: broker-3
    key_location: vm:micro-1
    super_user: true
    grants: []
  - name: controller-1
    key_location: vm:a1-1
    super_user: true
    grants: []
  - name: controller-2
    key_location: vm:a1-2
    super_user: true
    grants: []
  - name: controller-4
    key_location: vm:micro-2
    super_user: true
    grants: []
  - name: fluent-bit-gke
    key_location: cluster:observability/fluent-bit-kafka-client
    super_user: false
    grants:
      - resource: topic
        name: logs.proj.valid
        ops:
          - Write
          - Describe
      - resource: topic
        name: logs.proj.quarantine
        ops:
          - Write
          - Describe
      - resource: cluster
        ops:
          - IdempotentWrite
  - name: ops-agent-a1-1
    key_location: vm:a1-1
    super_user: false
    grants: &id001
      - resource: topic
        name: ops.platform.events
        ops:
          - Write
          - Describe
      - resource: topic
        name: ops.platform.metrics
        ops:
          - Write
          - Describe
      - resource: cluster
        ops:
          - IdempotentWrite
  - name: ops-agent-a1-2
    key_location: vm:a1-2
    super_user: false
    grants: *id001
  - name: ops-agent-micro-1
    key_location: vm:micro-1
    super_user: false
    grants: *id001
  - name: ops-agent-micro-2
    key_location: vm:micro-2
    super_user: false
    grants: *id001
  - name: ops-relay
    key_location: cluster:observability/ops-relay-kafka-client
    super_user: false
    grants:
      - resource: topic
        name: ops.platform.events
        ops:
          - Read
          - Describe
      - resource: topic
        name: ops.platform.metrics
        ops:
          - Read
          - Describe
      - resource: group
        name: ops-relay
        ops:
          - Read
      - resource: cluster
        ops:
          - Describe
          - DescribeConfigs
      - resource: topic
        name: '*'
        ops:
          - Describe
          - DescribeConfigs
  - name: ops-cli
    key_location: vm:all
    super_user: false
    grants:
      - resource: cluster
        ops:
          - Describe
          - DescribeConfigs
      - resource: topic
        name: '*'
        ops:
          - Describe
          - DescribeConfigs
      - resource: group
        name: '*'
        ops:
          - Describe
