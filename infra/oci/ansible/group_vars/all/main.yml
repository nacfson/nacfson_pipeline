kafka_uid: 1500
kafka_tls_dir: /etc/kafka/tls
kafka_data_dir: /var/lib/kafka/data
kafka_config_file: /etc/kafka/server.properties
kafka_container_tls_dir: /etc/kafka-node/tls
kafka_container_config: /etc/kafka-node/server.properties
kafka_vcn_cidr: 10.200.0.0/24
kafka_cert_renew_days: 30
kafka_cert_duration: 2160h
kafka_ca_issuer: kafka-mtls-ca
kafka_runner_namespace: oci-link
force_renew: false
base_packages:
  podman: 4.9.3+ds1-1ubuntu0.2
  wireguard-tools: 1.0.20210914-1ubuntu4
  nftables: 1.0.9-1ubuntu0.1
  chrony: 4.5-1ubuntu4.2
  openssl: 3.0.13-0ubuntu3.16
  curl: 8.5.0-2ubuntu10.16
kafka_admin:
  - podman
  - exec
  - --env=KAFKA_LOG4J_OPTS=-Dlog4j2.configurationFile=/opt/kafka/config/tools-log4j2.yaml
  - --env=KAFKA_OPTS=
  - kafka
kafka_admin_args:
  - --bootstrap-server
  - "{{ kafka_bootstrap_servers }}"
  - --command-config
  - /etc/kafka-node/clients/ops-cli.properties
jmx_exporter_version: 1.7.0
jmx_exporter_sha256: 0ad843261c567d1924a017d542e14c40f2afff523d940c25ee000742fde4b3a9
jmx_exporter_dir: /opt/jmx-exporter
cluster_built_marker: /etc/nacfson/cluster-built
