auth_enabled: true

analytics:
  reporting_enabled: false

server:
  http_listen_address: 0.0.0.0
  http_listen_port: 3100
  grpc_listen_address: 127.0.0.1
  grpc_listen_port: 9096
  log_level: warn
  http_tls_config:
    cert_file: /etc/loki/tls/loki-a1-2.crt
    key_file: /etc/loki/tls/loki-a1-2.key
    client_ca_file: /etc/loki/tls/ca.crt
    client_auth_type: RequireAndVerifyClientCert
  grpc_tls_config:
    cert_file: /etc/loki/tls/loki-a1-2.crt
    key_file: /etc/loki/tls/loki-a1-2.key
    client_ca_file: /etc/loki/tls/ca.crt
    client_auth_type: RequireAndVerifyClientCert

common:
  instance_addr: 127.0.0.1
  path_prefix: /var/lib/loki
  storage:
    filesystem:
      chunks_directory: /var/lib/loki/chunks
      rules_directory: /var/lib/loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

ingester:
  max_chunk_age: 48h
  chunk_idle_period: 30m

schema_config:
  configs:
    - from: "2026-01-01"
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

compactor:
  working_directory: /var/lib/loki/compactor
  retention_enabled: true
  delete_request_store: filesystem

limits_config:
  retention_period: 14d
  unordered_writes: true
  allow_structured_metadata: true
  ingestion_rate_mb: 4
  ingestion_burst_size_mb: 8
  per_stream_rate_limit: 2MB
  per_stream_rate_limit_burst: 4MB
  max_line_size: 256KB
  max_entries_limit_per_query: 2000
  max_query_length: 24h
  reject_old_samples: true
  reject_old_samples_max_age: 24h

runtime_config:
  file: /etc/loki/overrides.yaml

querier:
  max_concurrent: 2
