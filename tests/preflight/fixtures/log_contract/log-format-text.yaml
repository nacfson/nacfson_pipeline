apiVersion: apps/v1
kind: Deployment
metadata:
  name: test-app
  namespace: proj-test
spec:
  replicas: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: test-app
        app.kubernetes.io/version: v1.0.0
      annotations:
        logs.nacfson.cloud/app: "v3/json"
    spec:
      containers:
        - name: app
          image: ghcr.io/nacfson/test-app@sha256:1111111111111111111111111111111111111111111111111111111111111111
          env:
            - name: LOG_FORMAT
              value: text
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 50m
              memory: 64Mi
