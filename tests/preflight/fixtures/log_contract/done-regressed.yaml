apiVersion: apps/v1
kind: Deployment
metadata:
  name: test-app
  namespace: proj-test
spec:
  replicas: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: test-app
        app.kubernetes.io/version: "v1.0.0"
      annotations:
        logs.nacfson.cloud/done-app: "v2/legacy"
    spec:
      containers:
        - name: done-app
          image: ghcr.io/nacfson/test-app@sha256:1111111111111111111111111111111111111111111111111111111111111111
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 50m
              memory: 64Mi
