apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: proj-mismatch
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 9090
      targetPort: 9090
      protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: project-mismatch-isolation
  namespace: proj-mismatch
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              name: platform
      ports:
        - protocol: TCP
          port: 80
        - protocol: TCP
          port: 8080
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchExpressions:
              - key: k8s-app
                operator: In
                values:
                  - kube-dns
                  - node-local-dns
      ports:
        - protocol: UDP
          port: 53
---
apiVersion: traefik.io/v1alpha1
kind: TLSStore
metadata:
  name: default
  namespace: platform
spec:
  certificates:
    - secretName: mismatch-tls
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: mismatch-tls
  namespace: platform
spec:
  secretName: mismatch-tls
  dnsNames:
    - mismatch.example.com
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: project-mismatch-ingress
  namespace: proj-mismatch
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`mismatch.example.com`)
      kind: Rule
      priority: 10
      middlewares:
        - name: strip-forged-headers
          namespace: platform
      services:
        - name: web
          port: 9090
  tls: {}
