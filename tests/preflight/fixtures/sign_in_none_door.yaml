# Project that omits signIn. Absent means none: no forward-auth, no gateway egress.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: proj-open
spec:
  replicas: 1
  strategy:
    type: Recreate
  template:
    spec:
      automountServiceAccountToken: false
      containers:
        - name: web
          image: ghcr.io/nacfson/project-open@sha256:d3ab8644467bbbb2a49b0afc6631b2600ce344908ce15ddf99e8478c11ecaf21
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 200m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            capabilities:
              drop:
                - ALL
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: proj-open
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: 80
      protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: project-open-isolation
  namespace: proj-open
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              name: platform
      ports:
        - protocol: TCP
          port: 80
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: project-open-ingress
  namespace: proj-open
spec:
  entryPoints:
    - web
    - websecure
  routes:
    - match: Host(`open.example.com`)
      kind: Rule
      priority: 10
      middlewares:
        - name: strip-forged-headers
          namespace: platform
      services:
        - name: web
          port: 80
