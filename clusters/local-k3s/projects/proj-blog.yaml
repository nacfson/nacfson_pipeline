apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: proj-blog
  namespace: proj-blog
spec:
  interval: 5m
  retryInterval: 1m
  timeout: 5m
  prune: true
  wait: true
  serviceAccountName: blog-reconciler
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  dependsOn:
    - name: project-boundaries-blog
      namespace: flux-system
    - name: ingress
      namespace: flux-system
  path: ./deploy/projects/blog/workloads
  patches:
    - target:
        kind: IngressRoute
        name: project-blog-ingress
      patch: |
        - op: replace
          path: /spec/routes/0/match
          value: Host(`blog.example.com`)
