[SERVICE]
    Log_Level warn
    Parsers_File parsers.conf
    storage.path /state/chunks
    storage.sync normal
    storage.checksum off
    storage.max_chunks_up 128

[INPUT]
    Name tail
    Path /var/log/pods/proj-*_*/*/*.log
    Path_Key filepath
    Tag proj.*
    multiline.parser cri
    Read_from_Head On
    DB /state/tail.db
    storage.type filesystem
    Mem_Buf_Limit 5MB
    Skip_Long_Lines On

[FILTER]
    Name multiline
    Match proj.*
    multiline.key_content log
    multiline.parser go, python, java
    buffer on
    emitter_storage.type filesystem
    emitter_mem_buf_limit 4M

[FILTER]
    Name parser
    Match proj.*
    Key_Name filepath
    Parser pod_path
    Reserve_Data On

[FILTER]
    Name parser
    Match proj.*
    Key_Name log
    Parser json
    Reserve_Data On
    Preserve_Key On

[FILTER]
    Name lua
    Match proj.*
    script /fluent-bit/etc/log_contract.lua
    call process

[FILTER]
    Name rewrite_tag
    Match proj.*
    Rule $_route ^quarantine$ quarantine.$TAG false
    Emitter_Name rt_quarantine
    Emitter_Storage.type filesystem
    Emitter_Mem_Buf_Limit 4M

[FILTER]
    Name modify
    Match *
    Remove _route

[OUTPUT]
    Name kafka
    Match proj.*
    Brokers 10.200.0.11:9092,10.200.0.12:9092,10.200.0.13:9092
    Topics logs.proj.valid
    Format json
    timestamp_key _time
    timestamp_format iso8601
    rdkafka.request.required.acks -1
    rdkafka.enable.idempotence true
    Retry_Limit False
    storage.total_limit_size 192M

[OUTPUT]
    Name kafka
    Match quarantine.*
    Brokers 10.200.0.11:9092,10.200.0.12:9092,10.200.0.13:9092
    Topics logs.proj.quarantine
    Format json
    timestamp_key _time
    timestamp_format iso8601
    rdkafka.request.required.acks -1
    rdkafka.enable.idempotence true
    Retry_Limit False
    storage.total_limit_size 64M
