apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: observability

resources:
  - ../../../deploy/platform/observability
  - fluent-bit-kafka-tls.yaml
  - ops-relay.yaml

images:
  - name: ghcr.io/nacfson/ops-relay
    digest: sha256:bc81e225e090af4afd7110007e23db423181f2fa0f590b2e3647286af5604955

configMapGenerator:
  - name: fluent-bit-config
    behavior: merge
    files:
      - fluent-bit.conf=fluent-bit-kafka.conf

generatorOptions:
  disableNameSuffixHash: true

patches:
  - target:
      kind: DaemonSet
      name: fluent-bit
    patch: |-
      apiVersion: apps/v1
      kind: DaemonSet
      metadata:
        name: fluent-bit
      spec:
        template:
          spec:
            containers:
              - name: fluent-bit
                volumeMounts:
                  - name: kafka-tls
                    mountPath: /etc/kafka-tls
                    readOnly: true
            volumes:
              - name: kafka-tls
                secret:
                  secretName: fluent-bit-kafka-client
                  defaultMode: 0440
  - target:
      kind: StatefulSet
      name: victorialogs
    patch: |-
      $patch: delete
      apiVersion: apps/v1
      kind: StatefulSet
      metadata:
        name: victorialogs
  - target:
      kind: Service
      name: victorialogs
    patch: |-
      $patch: delete
      apiVersion: v1
      kind: Service
      metadata:
        name: victorialogs
  - target:
      kind: NetworkPolicy
      name: victorialogs-ingress
    patch: |-
      $patch: delete
      apiVersion: networking.k8s.io/v1
      kind: NetworkPolicy
      metadata:
        name: victorialogs-ingress
  - target:
      kind: Deployment
      name: error-detector
    patch: |-
      $patch: delete
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: error-detector
  - target:
      kind: PersistentVolumeClaim
      name: error-detector-state
    patch: |-
      $patch: delete
      apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: error-detector-state
  - target:
      kind: ServiceAccount
      name: error-detector
    patch: |-
      $patch: delete
      apiVersion: v1
      kind: ServiceAccount
      metadata:
        name: error-detector
  - target:
      kind: NetworkPolicy
      name: error-detector-egress
    patch: |-
      $patch: delete
      apiVersion: networking.k8s.io/v1
      kind: NetworkPolicy
      metadata:
        name: error-detector-egress
  - target:
      kind: NetworkPolicy
      name: fluent-bit-egress
    patch: |-
      - op: replace
        path: /spec/egress/1
        value:
          to:
            - ipBlock:
                cidr: 10.200.0.11/32
            - ipBlock:
                cidr: 10.200.0.12/32
            - ipBlock:
                cidr: 10.200.0.13/32
          ports:
            - protocol: TCP
              port: 9092
