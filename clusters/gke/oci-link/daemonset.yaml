apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: wg-slot-agent
  namespace: oci-link
  labels:
    app.kubernetes.io/name: wg-slot-agent
    app.kubernetes.io/part-of: platform
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: wg-slot-agent
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: wg-slot-agent
        app.kubernetes.io/part-of: platform
    spec:
      serviceAccountName: wg-slot-agent
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      terminationGracePeriodSeconds: 30
      tolerations:
        - key: cloud.google.com/gke-spot
          operator: Equal
          value: "true"
          effect: NoSchedule
      containers:
        - name: wg-slot-agent
          image: ghcr.io/nacfson/wg-slot-agent
          args: ["run"]
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: WG_MODE
              value: snat
          securityContext:
            runAsUser: 0
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop:
                - ALL
              add:
                - NET_ADMIN
          volumeMounts:
            - name: pool
              mountPath: /etc/wg-slot-pool
              readOnly: true
            - name: keys
              mountPath: /etc/wg-slot-keys
              readOnly: true
            - name: peers
              mountPath: /etc/wg-peers
              readOnly: true
            - name: fluent-bit-state
              mountPath: /var/lib/fluent-bit-state
              readOnly: true
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 10m
              memory: 32Mi
      volumes:
        - name: pool
          configMap:
            name: wg-slot-pool
        - name: keys
          secret:
            secretName: wg-slot-keys
            optional: true
            defaultMode: 0400
        - name: peers
          configMap:
            name: wg-peers
        - name: fluent-bit-state
          hostPath:
            path: /var/lib/fluent-bit-state
            type: DirectoryOrCreate
