apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ops-relay
  namespace: oci-link
rules:
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ops-relay
  namespace: oci-link
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ops-relay
subjects:
  - kind: ServiceAccount
    name: ops-relay
    namespace: observability
