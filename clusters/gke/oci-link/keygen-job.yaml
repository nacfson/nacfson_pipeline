apiVersion: batch/v1
kind: Job
metadata:
  name: wg-slot-keygen
  namespace: oci-link
  annotations:
    kustomize.toolkit.fluxcd.io/force: enabled
  labels:
    app.kubernetes.io/name: wg-slot-keygen
    app.kubernetes.io/part-of: platform
spec:
  backoffLimit: 20
  template:
    metadata:
      labels:
        app.kubernetes.io/name: wg-slot-keygen
    spec:
      serviceAccountName: wg-slot-keygen
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: keygen
          image: ghcr.io/nacfson/wg-slot-agent
          args: ["keygen"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: pool
              mountPath: /etc/wg-slot-pool
              readOnly: true
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 10m
              memory: 32Mi
      volumes:
        - name: pool
          configMap:
            name: wg-slot-pool
