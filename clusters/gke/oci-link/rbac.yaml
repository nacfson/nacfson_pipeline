apiVersion: v1
kind: ServiceAccount
metadata:
  name: wg-slot-agent
  namespace: oci-link
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: wg-slot-keygen
  namespace: oci-link
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: wg-slot-agent
  namespace: oci-link
rules:
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: wg-slot-agent
  namespace: oci-link
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: wg-slot-agent
subjects:
  - kind: ServiceAccount
    name: wg-slot-agent
    namespace: oci-link
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: oci-link-wg-slot-agent-nodes
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: oci-link-wg-slot-agent-nodes
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: oci-link-wg-slot-agent-nodes
subjects:
  - kind: ServiceAccount
    name: wg-slot-agent
    namespace: oci-link
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: wg-slot-keygen
  namespace: oci-link
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["wg-slot-keys"]
    verbs: ["get", "update"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["wg-slot-public"]
    verbs: ["get", "update"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: wg-slot-keygen
  namespace: oci-link
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: wg-slot-keygen
subjects:
  - kind: ServiceAccount
    name: wg-slot-keygen
    namespace: oci-link
