apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: oci-link-certificate-requests
  labels:
    platform.nacfson.io/managed-by: platform
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["cert-manager.io"]
        apiVersions: ["*"]
        operations: ["CREATE", "UPDATE"]
        resources: ["certificaterequests"]
  validations:
    - expression: >-
        object.spec.issuerRef.name == 'kafka-mtls-ca' &&
        object.spec.issuerRef.kind == 'ClusterIssuer' &&
        (!has(object.spec.issuerRef.group) || object.spec.issuerRef.group == 'cert-manager.io')
      message: "CertificateRequests in oci-link must use ClusterIssuer/kafka-mtls-ca"
    - expression: "!has(object.spec.isCA) || object.spec.isCA == false"
      message: "CertificateRequests in oci-link must not ask for a CA certificate"
    - expression: "has(object.spec.duration) && duration(object.spec.duration) <= duration('2160h')"
      message: "CertificateRequests in oci-link must set a duration of at most 2160h"
    - expression: "has(object.spec.usages) && object.spec.usages.all(u, u in ['digital signature', 'client auth', 'server auth'])"
      message: "CertificateRequests in oci-link may only use digital signature, client auth, and server auth"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: oci-link-certificate-requests
  labels:
    platform.nacfson.io/managed-by: platform
spec:
  policyName: oci-link-certificate-requests
  validationActions: [Deny]
  matchResources:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: oci-link
