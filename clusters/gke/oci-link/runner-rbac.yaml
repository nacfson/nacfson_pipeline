apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kafka-runner
  namespace: oci-link
rules:
  - apiGroups: ["cert-manager.io"]
    resources: ["certificaterequests"]
    verbs: ["create", "get", "list"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kafka-runner
  namespace: oci-link
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kafka-runner
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: User
    name: cc-kafka-runner@nacfson-pipeline.iam.gserviceaccount.com
