apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: governance
  namespace: flux-system
spec:
  interval: 5m
  retryInterval: 1m
  timeout: 5m
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./deploy/platform/governance
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cert-manager
  namespace: flux-system
spec:
  interval: 5m
  retryInterval: 1m
  timeout: 5m
  prune: true
  wait: true
  dependsOn:
    - name: governance
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./deploy/platform/cert-manager
  patches:
    - target:
        kind: Deployment
        name: cert-manager
        namespace: cert-manager
      patch: |
        apiVersion: apps/v1
        kind: Deployment
        metadata:
          name: cert-manager
          namespace: cert-manager
        spec:
          template:
            spec:
              nodeSelector:
                cloud.google.com/gke-spot: "true"
              tolerations:
                - key: cloud.google.com/gke-spot
                  operator: Equal
                  value: "true"
                  effect: NoSchedule
              containers:
                - name: cert-manager-controller
                  resources:
                    requests:
                      cpu: "25m"
                      memory: "96Mi"
                    limits:
                      cpu: "200m"
                      memory: "128Mi"
    - target:
        kind: Deployment
        name: cert-manager-cainjector
        namespace: cert-manager
      patch: |
        apiVersion: apps/v1
        kind: Deployment
        metadata:
          name: cert-manager-cainjector
          namespace: cert-manager
        spec:
          template:
            spec:
              nodeSelector:
                cloud.google.com/gke-spot: "true"
              tolerations:
                - key: cloud.google.com/gke-spot
                  operator: Equal
                  value: "true"
                  effect: NoSchedule
              containers:
                - name: cert-manager-cainjector
                  resources:
                    requests:
                      cpu: "10m"
                      memory: "64Mi"
                    limits:
                      cpu: "100m"
                      memory: "64Mi"
    - target:
        kind: Deployment
        name: cert-manager-webhook
        namespace: cert-manager
      patch: |
        apiVersion: apps/v1
        kind: Deployment
        metadata:
          name: cert-manager-webhook
          namespace: cert-manager
        spec:
          template:
            spec:
              nodeSelector:
                cloud.google.com/gke-spot: "true"
              tolerations:
                - key: cloud.google.com/gke-spot
                  operator: Equal
                  value: "true"
                  effect: NoSchedule
              containers:
                - name: cert-manager-webhook
                  resources:
                    requests:
                      cpu: "10m"
                      memory: "32Mi"
                    limits:
                      cpu: "100m"
                      memory: "48Mi"
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: vault
  namespace: flux-system
spec:
  interval: 5m
  retryInterval: 1m
  timeout: 5m
  prune: true
  wait: true
  healthChecks:
    - apiVersion: apps/v1
      kind: StatefulSet
      name: openbao
      namespace: vault
  dependsOn:
    - name: governance
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./deploy/platform/vault
  patches:
    - target:
        kind: ServiceAccount
        name: openbao
        namespace: vault
      patch: |
        apiVersion: v1
        kind: ServiceAccount
        metadata:
          name: openbao
          namespace: vault
          annotations:
            iam.gke.io/gcp-service-account: openbao-kms@nacfson-pipeline.iam.gserviceaccount.com
    - target:
        kind: StatefulSet
        name: openbao
        namespace: vault
      patch: |
        apiVersion: apps/v1
        kind: StatefulSet
        metadata:
          name: openbao
          namespace: vault
        spec:
          template:
            spec:
              serviceAccountName: openbao
              automountServiceAccountToken: true
              containers:
                - name: openbao
                  resources:
                    requests:
                      cpu: 25m
                      memory: 64Mi
                    limits:
                      cpu: 200m
                      memory: 96Mi
    - target:
        kind: ConfigMap
        name: openbao-config
        namespace: vault
      patch: |
        apiVersion: v1
        kind: ConfigMap
        metadata:
          name: openbao-config
          namespace: vault
        data:
          openbao.hcl: |
            ui = false

            storage "raft" {
              path = "/var/lib/openbao/data"
              node_id = "openbao-0"
            }

            listener "tcp" {
              address = "0.0.0.0:8200"
              cluster_address = "0.0.0.0:8201"
              tls_disable = 1
            }

            seal "gcpckms" {
              project    = "nacfson-pipeline"
              region     = "asia-northeast3"
              key_ring   = "nacfson-vault"
              crypto_key = "openbao-unseal"
            }

            api_addr = "http://openbao-service.vault.svc:8200"
            cluster_addr = "http://openbao-0.openbao-internal.vault.svc:8201"
    - target:
        kind: CronJob
        name: openbao-daily-snapshot
        namespace: vault
      patch: |
        apiVersion: batch/v1
        kind: CronJob
        metadata:
          name: openbao-daily-snapshot
          namespace: vault
        spec:
          jobTemplate:
            spec:
              template:
                spec:
                  containers:
                    - name: raft-snapshot
                      resources:
                        requests:
                          cpu: 25m
                          memory: 64Mi
                        limits:
                          cpu: 100m
                          memory: 128Mi
    # Allow OpenBao Workload Identity token exchange (nacfson-pipeline.svc.id.goog via gke-metadata-server)
    # and Private Google Access KMS auto-unseal (199.36.153.8/30:443) without 0.0.0.0/0 egress.
    - target:
        kind: NetworkPolicy
        name: openbao-ingress-policy
        namespace: vault
      patch: |
        - op: add
          path: /spec/egress/-
          value:
            to:
              - ipBlock:
                  cidr: 169.254.169.254/32
            ports:
              - protocol: TCP
                port: 80
              - protocol: TCP
                port: 988
        - op: add
          path: /spec/egress/-
          value:
            to:
              - ipBlock:
                  cidr: 199.36.153.8/30
            ports:
              - protocol: TCP
                port: 443
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
