---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: project-boundaries-blog
  namespace: flux-system
spec:
  interval: 5m
  retryInterval: 1m
  timeout: 5m
  prune: true
  wait: true
  dependsOn:
    - name: governance
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./deploy/projects/blog/boundary
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: tls
  namespace: flux-system
spec:
  interval: 5m
  retryInterval: 1m
  timeout: 10m
  prune: true
  wait: true
  dependsOn:
    - name: cert-manager
    - name: ingress
    - name: project-boundaries
    - name: project-boundaries-health
    - name: project-boundaries-blog
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./deploy/platform/tls
  patches:
    - target:
        kind: Certificate
        name: auth-tls
      patch: |
        - op: replace
          path: /spec/dnsNames/0
          value: auth.nacfson.cloud
        - op: replace
          path: /spec/issuerRef/name
          value: letsencrypt-prod
    - target:
        kind: Certificate
        name: pn-tls
      patch: |
        - op: replace
          path: /spec/dnsNames/0
          value: pn.nacfson.cloud
        - op: replace
          path: /spec/issuerRef/name
          value: letsencrypt-prod
    - target:
        kind: Certificate
        name: health-tls
      patch: |
        - op: replace
          path: /spec/dnsNames/0
          value: health.nacfson.cloud
        - op: replace
          path: /spec/issuerRef/name
          value: letsencrypt-prod
    - target:
        kind: Certificate
        name: blog-tls
      patch: |
        - op: replace
          path: /spec/dnsNames/0
          value: blog.nacfson.cloud
        - op: replace
          path: /spec/issuerRef/name
          value: letsencrypt-prod
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: projects
  namespace: flux-system
spec:
  interval: 5m
  retryInterval: 1m
  timeout: 5m
  prune: true
  wait: false
  dependsOn:
    - name: project-boundaries
    - name: project-boundaries-health
    - name: project-boundaries-blog
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./clusters/gke/projects
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: observability
  namespace: flux-system
spec:
  interval: 5m
  retryInterval: 1m
  timeout: 5m
  prune: true
  wait: true
  # VictoriaLogs is deleted on GKE (logs stream to OCI Kafka via WireGuard) and error-detector is paused
  # at replicas: 0 until Spec 014 switches it to Kafka logs.proj.errors, so healthChecks watch fluent-bit only.
  healthChecks:
    - apiVersion: apps/v1
      kind: DaemonSet
      name: fluent-bit
      namespace: observability
  dependsOn:
    - name: governance
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./clusters/gke/observability
  patches:
    - target:
        kind: DaemonSet
        name: fluent-bit
        namespace: observability
      patch: |
        apiVersion: apps/v1
        kind: DaemonSet
        metadata:
          name: fluent-bit
          namespace: observability
        spec:
          template:
            spec:
              containers:
                - name: fluent-bit
                  resources:
                    requests:
                      cpu: 25m
                      memory: 64Mi
                    limits:
                      cpu: 50m
                      memory: 64Mi
    - target:
        kind: Deployment
        name: error-detector
        namespace: observability
      patch: |
        apiVersion: apps/v1
        kind: Deployment
        metadata:
          name: error-detector
          namespace: observability
        spec:
          template:
            spec:
              containers:
                - name: error-detector
                  resources:
                    requests:
                      cpu: 25m
                      memory: 64Mi
                    limits:
                      cpu: 25m
                      memory: 64Mi
