apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: database
  namespace: flux-system
spec:
  interval: 5m
  retryInterval: 1m
  timeout: 5m
  prune: true
  wait: true
  healthChecks:
    - apiVersion: apps/v1
      kind: StatefulSet
      name: postgres
      namespace: identity
  dependsOn:
    - name: vault
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./deploy/platform/database
  patches:
    - target:
        kind: StatefulSet
        name: postgres
        namespace: identity
      patch: |
        apiVersion: apps/v1
        kind: StatefulSet
        metadata:
          name: postgres
          namespace: identity
        spec:
          template:
            spec:
              containers:
                - name: postgres
                  resources:
                    requests:
                      cpu: 50m
                      memory: 256Mi
                    limits:
                      cpu: 250m
                      memory: 256Mi
    - target:
        kind: CronJob
        name: postgres-daily-backup
        namespace: identity
      patch: |
        apiVersion: batch/v1
        kind: CronJob
        metadata:
          name: postgres-daily-backup
          namespace: identity
        spec:
          jobTemplate:
            spec:
              template:
                spec:
                  containers:
                    - name: pg-backup
                      resources:
                        requests:
                          cpu: "25m"
                          memory: "128Mi"
                        limits:
                          cpu: "100m"
                          memory: "128Mi"
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: identity
  namespace: flux-system
spec:
  interval: 5m
  retryInterval: 1m
  timeout: 5m
  prune: true
  wait: true
  dependsOn:
    - name: database
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./deploy/platform/identity
  patches:
    - target:
        kind: Deployment
        name: gateway
        namespace: identity
      patch: |
        apiVersion: apps/v1
        kind: Deployment
        metadata:
          name: gateway
          namespace: identity
        spec:
          template:
            spec:
              containers:
                - name: gateway
                  env:
                    - name: COOKIE_DOMAIN
                      value: ".nacfson.cloud"
                    - name: KEYCLOAK_PUBLIC_URL
                      value: "https://auth.nacfson.cloud/realms/platform"
                    - name: PROJECT_RETURN_HOSTS
                      value: "pn.nacfson.cloud,health.nacfson.cloud"
                  resources:
                    requests:
                      cpu: 25m
                      memory: 64Mi
                    limits:
                      cpu: 100m
                      memory: 64Mi
    - target:
        kind: Deployment
        name: keycloak
        namespace: identity
      patch: |
        apiVersion: apps/v1
        kind: Deployment
        metadata:
          name: keycloak
          namespace: identity
        spec:
          template:
            spec:
              containers:
                - name: keycloak
                  env:
                    - name: KC_HOSTNAME_URL
                      value: "https://auth.nacfson.cloud"
                    - name: JAVA_OPTS_APPEND
                      value: "-Xms256m -Xmx576m -XX:MaxRAMPercentage=70 -Dkeycloak.migration.strategy=OVERWRITE_EXISTING -Dkeycloak.migration.replace-placeholders=true"
                  resources:
                    requests:
                      cpu: 100m
                      memory: 832Mi
                    limits:
                      cpu: 500m
                      memory: 832Mi
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: traefik
  namespace: flux-system
spec:
  interval: 5m
  retryInterval: 1m
  timeout: 5m
  prune: true
  wait: true
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: traefik
      namespace: platform
  dependsOn:
    - name: governance
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./deploy/platform/traefik
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: ingress
  namespace: flux-system
spec:
  interval: 5m
  retryInterval: 1m
  timeout: 5m
  prune: true
  wait: true
  dependsOn:
    - name: identity
    - name: traefik
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./deploy/platform/ingress
  # Spec 004 R3 amendment: postBuild is allowed on this layer only, for AUTH_HOST only.
  # Route paths live in deploy/platform/ingress/ingress-allowlist.yaml (single copy).
  postBuild:
    substitute:
      AUTH_HOST: auth.nacfson.cloud
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: project-boundaries
  namespace: flux-system
spec:
  interval: 5m
  retryInterval: 1m
  timeout: 5m
  prune: true
  wait: true
  dependsOn:
    - name: governance
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./deploy/projects/pn/boundary
  patches:
    - target:
        kind: ResourceQuota
        name: project-pn-quota
        namespace: proj-pn
      patch: |
        apiVersion: v1
        kind: ResourceQuota
        metadata:
          name: project-pn-quota
          namespace: proj-pn
        spec:
          hard:
            requests.memory: "416Mi"
            limits.memory: "416Mi"
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: project-boundaries-health
  namespace: flux-system
spec:
  interval: 5m
  retryInterval: 1m
  timeout: 5m
  prune: true
  wait: true
