apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - gotk-components.yaml
  - gotk-sync.yaml

patches:
  - patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: source-controller
        namespace: flux-system
      spec:
        replicas: 1
        template:
          spec:
            nodeSelector:
              cloud.google.com/gke-spot: "true"
            tolerations:
              - key: cloud.google.com/gke-spot
                operator: Equal
                value: "true"
                effect: NoSchedule
            containers:
              - name: manager
                resources:
                  requests:
                    cpu: 50m
                    memory: 64Mi
                  limits:
                    cpu: 500m
                    memory: 128Mi
    target:
      kind: Deployment
      name: source-controller
      namespace: flux-system
  - patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: kustomize-controller
        namespace: flux-system
      spec:
        replicas: 1
        template:
          spec:
            nodeSelector:
              cloud.google.com/gke-spot: "true"
            tolerations:
              - key: cloud.google.com/gke-spot
                operator: Equal
                value: "true"
                effect: NoSchedule
            containers:
              - name: manager
                resources:
                  requests:
                    cpu: 100m
                    memory: 64Mi
                  limits:
                    cpu: 500m
                    memory: 128Mi
    target:
      kind: Deployment
      name: kustomize-controller
      namespace: flux-system
