apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cni
  namespace: flux-system
spec:
  interval: 5m
  retryInterval: 1m
  timeout: 5m
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./deploy/platform/cni
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: governance
  namespace: flux-system
spec:
  interval: 5m
  retryInterval: 1m
  timeout: 5m
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./deploy/platform/governance
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: vault
  namespace: flux-system
spec:
  interval: 5m
  retryInterval: 1m
  timeout: 5m
  prune: true
  wait: true
  healthChecks:
    - apiVersion: apps/v1
      kind: StatefulSet
      name: openbao
      namespace: vault
  dependsOn:
    - name: cni
    - name: governance
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./deploy/platform/vault
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: vault-proxies
  namespace: flux-system
spec:
  interval: 5m
  retryInterval: 1m
  timeout: 5m
  prune: true
  wait: true
  dependsOn:
    - name: vault
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./deploy/platform/vault-proxies
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: database
  namespace: flux-system
spec:
  interval: 5m
  retryInterval: 1m
  timeout: 5m
  prune: true
  wait: true
  healthChecks:
    - apiVersion: apps/v1
      kind: StatefulSet
      name: postgres
      namespace: identity
  dependsOn:
    - name: vault
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./deploy/platform/database
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: identity
  namespace: flux-system
spec:
  interval: 5m
  retryInterval: 1m
  timeout: 5m
  prune: true
  wait: true
  dependsOn:
    - name: database
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./deploy/platform/identity
  patches:
    - target:
        kind: Deployment
        name: gateway
      patch: |
        apiVersion: apps/v1
        kind: Deployment
        metadata:
          name: gateway
        spec:
          template:
            spec:
              containers:
                - name: gateway
                  env:
                    - name: COOKIE_DOMAIN
                      value: ".nacfson.cloud"
                    - name: KEYCLOAK_PUBLIC_URL
                      value: "https://auth.nacfson.cloud/realms/platform"
                    - name: PROJECT_RETURN_HOSTS
                      value: "pn.nacfson.cloud,health.nacfson.cloud"
    - target:
        kind: Deployment
        name: keycloak
      patch: |
        apiVersion: apps/v1
        kind: Deployment
        metadata:
          name: keycloak
        spec:
          template:
            spec:
              containers:
                - name: keycloak
                  env:
                    - name: KC_HOSTNAME_URL
                      value: "https://auth.nacfson.cloud"
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: ingress
  namespace: flux-system
spec:
  interval: 5m
  retryInterval: 1m
  timeout: 5m
  prune: true
  wait: true
  dependsOn:
    - name: identity
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./deploy/platform/ingress
  # Spec 004 R3 amendment: postBuild is allowed on this layer only, for AUTH_HOST only.
  # Route paths live in deploy/platform/ingress/ingress-allowlist.yaml (single copy).
  postBuild:
    substitute:
      AUTH_HOST: auth.nacfson.cloud
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cert-manager
  namespace: flux-system
spec:
  interval: 5m
  retryInterval: 1m
  timeout: 5m
  prune: true
  wait: true
  dependsOn:
    - name: governance
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./deploy/platform/cert-manager
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: tls
  namespace: flux-system
spec:
  interval: 5m
  retryInterval: 1m
  timeout: 10m
  prune: true
  wait: true
  dependsOn:
    - name: cert-manager
    - name: ingress
    - name: project-boundaries
    - name: project-boundaries-health
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./deploy/platform/tls
  patches:
    # To debug challenges without production rate limits, set the issuer to letsencrypt-staging.
    - target:
        kind: Certificate
        name: auth-tls
      patch: |
        - op: replace
          path: /spec/dnsNames/0
          value: auth.nacfson.cloud
        - op: replace
          path: /spec/issuerRef/name
          value: letsencrypt-prod
    - target:
        kind: Certificate
        name: pn-tls
      patch: |
        - op: replace
          path: /spec/dnsNames/0
          value: pn.nacfson.cloud
        - op: replace
          path: /spec/issuerRef/name
          value: letsencrypt-prod
    - target:
        kind: Certificate
        name: health-tls
      patch: |
        - op: replace
          path: /spec/dnsNames/0
          value: health.nacfson.cloud
        - op: replace
          path: /spec/issuerRef/name
          value: letsencrypt-prod
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: project-boundaries
  namespace: flux-system
spec:
  interval: 5m
  retryInterval: 1m
  timeout: 5m
  prune: true
  wait: true
  dependsOn:
    - name: cni
    - name: governance
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./deploy/projects/pn/boundary
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: project-boundaries-health
  namespace: flux-system
spec:
  interval: 5m
  retryInterval: 1m
  timeout: 5m
  prune: true
  wait: true
  dependsOn:
    - name: governance
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./deploy/projects/health/boundary
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: projects
  namespace: flux-system
spec:
  interval: 5m
  retryInterval: 1m
  timeout: 5m
  prune: true
  wait: false
  dependsOn:
    - name: project-boundaries
    - name: project-boundaries-health
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./clusters/vps-k3s/projects
