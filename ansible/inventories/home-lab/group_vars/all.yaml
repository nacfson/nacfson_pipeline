---
# Shared pins — must match platform-config/.platform/versions.yaml
k3s_version: "v1.32.13+k3s1"
k3s_binary_url: "https://github.com/k3s-io/k3s/releases/download/v1.32.13%2Bk3s1/k3s"
flux_version: "v2.9.5"
flux_tarball_url: "https://github.com/fluxcd/flux2/releases/download/v2.9.5/flux_2.9.5_linux_amd64.tar.gz"
platform_arch: "amd64"

host_timezone: "UTC"
# Set only to create an extra admin user; default reuses OpenTofu ansible_user.
bootstrap_admin_user: ""

# Flux bootstrap/recovery source.
# Initially point this at the private off-server mirror. After Flux deploys
# Forgejo and platform/platform-config is mirrored there, change it to the
# Forgejo SSH URL as the explicit steady-state cutover.
flux_git_url: "ssh://git@github.com/nacfson/nacfson_pipeline.git"
flux_git_branch: "main"
flux_git_path: "./platform-config/clusters/production"
flux_git_auth_mode: "ssh" # ssh | https
flux_deploy_key_private_path: "{{ playbook_dir }}/../.secrets/flux-deploy-key"
flux_https_username: "git"
flux_https_password: ""
sops_age_key_path: "{{ playbook_dir }}/../.secrets/sops-age/age.key"
flux_skip_sops_secret: false

# Backup stub — full etcd upload is a follow-up
backup_agent_enable_stub_timer: false

# Optional: fetch kubeconfig to control node after k3s install
k3s_fetch_kubeconfig: true
k3s_local_kubeconfig_path: "{{ playbook_dir }}/../.secrets/kubeconfig"
