forgejo_http_node_port: 30080
forgejo_ssh_node_port: 30222
forgejo_admin_user: platform-bootstrap
forgejo_admin_email: platform-bootstrap@localhost
forgejo_owner: platform
forgejo_repository: nacfson_pipeline
forgejo_seed_repo_path: "{{ playbook_dir }}/../.."
