---
# Full bootstrap: host prep → k3s → Forgejo → Flux.
# Ansible creates only the minimum Forgejo seed service and Git repository needed
# for Flux to start. Flux owns routine platform and application reconciliation.

- name: Host preparation (all nodes)
  hosts: application:registry
  gather_facts: true
  become: true
  roles:
    - role: common
    - role: host_firewall
    - role: storage
    - role: backup_agent

- name: Kubernetes, local Git, and Flux bootstrap (application only)
  hosts: application
  gather_facts: true
  become: true
  roles:
    - role: k3s
    - role: forgejo_bootstrap
    - role: flux_bootstrap
