# Declarative Google Cloud Build multi-architecture (linux/amd64,linux/arm64)
# OCI manifest-list pipeline for public Google Artifact Registry (GAR).
#
# Target Registry (Spec 012 / Constitution v2.3.0):
#   asia-northeast3-docker.pkg.dev/nacfson-pipeline/nacfson-public/<image>@sha256:...
#
# Modes:
#   1. Default (_TENANT_IMAGE == ""): builds and pushes all first-party platform images
#      (platform-auth-gateway, vault-db-proxy, vault-ai-proxy, vault-notify-proxy,
#       error-detector, logcheck) as linux/amd64,linux/arm64 manifest lists.
#   2. Tenant single-image mode (_TENANT_IMAGE != ""): builds and pushes a hosted
#      tenant image (e.g. project-pn-backend, project-pn-frontend,
#      project-health-backend, project-health-frontend, project-blog-web) with
#      matching org.opencontainers.image.version label for Gate 1b conformance.

substitutions:
  _GAR_REGION: asia-northeast3
  _GAR_REPO: nacfson-public
  _PLATFORMS: linux/amd64,linux/arm64
  _TENANT_IMAGE: ""
  _TENANT_CONTEXT: "."
  _TENANT_DOCKERFILE: "Dockerfile"
  _IMAGE_VERSION: "v0.1.0"

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8

steps:
  - id: setup-multiarch-buildx
    name: gcr.io/cloud-builders/docker:24.0.9
    entrypoint: bash
    args:
      - -euo
      - pipefail
      - -c
      - |
        docker run --privileged --rm tonistiigi/binfmt:qemu-v8.1.5 --install all
        docker buildx create --name multiarch --driver docker-container --use
        docker buildx inspect --bootstrap

  - id: build-and-push-multiarch
    name: gcr.io/cloud-builders/docker:24.0.9
    entrypoint: bash
    args:
      - -euo
      - pipefail
      - -c
      - |
        REG="${_GAR_REGION}-docker.pkg.dev/${PROJECT_ID}/${_GAR_REPO}"
        REV="${COMMIT_SHA:-local}"
        SHORT="${SHORT_SHA:-dev}"
        mkdir -p /workspace/digests

        build_one() {
          local img_name="$1"
          local ctx="$2"
          local df="$3"
          local ver="$4"
          local ref="${REG}/${img_name}:sha-${SHORT}"

          echo "=== Building ${ref} (${_PLATFORMS}) ==="
          docker buildx build \
            --builder multiarch \
            --platform "${_PLATFORMS}" \
            --label "org.opencontainers.image.revision=${REV}" \
            --label "org.opencontainers.image.version=${ver}" \
            --tag "${ref}" \
            --file "${df}" \
            --metadata-file "/workspace/digests/${img_name}.json" \
            --push \
            "${ctx}"

          python3 - "${img_name}" "${REG}" "/workspace/digests/${img_name}.json" <<'PY'
        import json, sys
        img_name, reg, meta_path = sys.argv[1], sys.argv[2], sys.argv[3]
        meta = json.load(open(meta_path, encoding="utf-8"))
        digest = meta["containerimage.digest"]
        print(f"PINNED_DIGEST {img_name}={reg}/{img_name}@{digest}")
        PY
        }

        if [ -n "${_TENANT_IMAGE}" ]; then
          build_one "${_TENANT_IMAGE}" "${_TENANT_CONTEXT}" "${_TENANT_DOCKERFILE}" "${_IMAGE_VERSION}"
        else
          build_one "platform-auth-gateway" "gateway" "gateway/Dockerfile" "${_IMAGE_VERSION}"
          build_one "vault-db-proxy" "services/vault-proxies" "services/vault-proxies/Dockerfile.db-proxy" "${_IMAGE_VERSION}"
          build_one "vault-ai-proxy" "services/vault-proxies" "services/vault-proxies/Dockerfile.ai-proxy" "${_IMAGE_VERSION}"
          build_one "vault-notify-proxy" "services/vault-proxies" "services/vault-proxies/Dockerfile.notify-proxy" "${_IMAGE_VERSION}"
          build_one "error-detector" "services/error-pipeline" "services/error-pipeline/Dockerfile.error-detector" "${_IMAGE_VERSION}"
          build_one "logcheck" "services/error-pipeline" "services/error-pipeline/Dockerfile.logcheck" "${_IMAGE_VERSION}"
        fi
