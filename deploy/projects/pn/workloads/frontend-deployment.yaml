apiVersion: apps/v1
kind: Deployment
metadata:
  name: pn-frontend
  namespace: proj-pn
  labels:
    app.kubernetes.io/name: pn-frontend
    app.kubernetes.io/part-of: project-pn
    platform.nacfson.io/managed-by: platform
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: pn-frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pn-frontend
        app.kubernetes.io/part-of: project-pn
    spec:
      serviceAccountName: pn-workload-sa
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: frontend
          image: ghcr.io/nacfson/project-pn-frontend:98c2a89@sha256:bf73c01d7d0eccd581ab52712e272255f285beca216e4812f24be600d14174d7
          imagePullPolicy: IfNotPresent
          env:
            - name: PN_BACKEND_HOST
              value: "pn-backend"
            - name: PN_BACKEND_PORT
              value: "8080"
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "100m"
              memory: "128Mi"
          volumeMounts:
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d
            - name: tmp
              mountPath: /tmp
            - name: nginx-cache
              mountPath: /var/cache/nginx
            - name: nginx-run
              mountPath: /var/run
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 2
            periodSeconds: 5
      volumes:
        - name: nginx-conf
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        - name: nginx-cache
          emptyDir: {}
        - name: nginx-run
          emptyDir: {}
