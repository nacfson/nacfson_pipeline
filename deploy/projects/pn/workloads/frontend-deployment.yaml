apiVersion: apps/v1
kind: Deployment
metadata:
  name: pn-frontend
  namespace: proj-pn
  labels:
    app.kubernetes.io/name: pn-frontend
    app.kubernetes.io/part-of: project-pn
    platform.nacfson.io/managed-by: platform
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: pn-frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pn-frontend
        app.kubernetes.io/part-of: project-pn
    spec:
      restartPolicy: Always
      serviceAccountName: pn-workload-sa
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: frontend
          image: ghcr.io/nacfson/project-pn-frontend@sha256:9757cfd8e1771c802b251ce434fd003982aef1ae61eac18c5572fbb61d16708c
          imagePullPolicy: IfNotPresent
          env:
            - name: PN_BACKEND_HOST
              value: "pn-backend"
            - name: PN_BACKEND_PORT
              value: "8080"
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "100m"
              memory: "128Mi"
          volumeMounts:
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d
            - name: tmp
              mountPath: /tmp
            - name: nginx-cache
              mountPath: /var/cache/nginx
            - name: nginx-run
              mountPath: /var/run
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: 80
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
            successThreshold: 1
          startupProbe:
            httpGet:
              # 007 amendment: exercise nginx `location /api/` -> backend auth router, not only the
              # `location = /healthz` block (see specs/007-pn-readiness-restart/contracts/probe-matrix.md).
              path: /api/auth/language-options
              port: 80
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 36
            successThreshold: 1
      volumes:
        - name: nginx-conf
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        - name: nginx-cache
          emptyDir: {}
        - name: nginx-run
          emptyDir: {}
