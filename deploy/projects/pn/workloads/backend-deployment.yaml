apiVersion: apps/v1
kind: Deployment
metadata:
  name: pn-backend
  namespace: proj-pn
  labels:
    app.kubernetes.io/name: pn-backend
    app.kubernetes.io/part-of: project-pn
    platform.nacfson.io/managed-by: platform
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: pn-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pn-backend
        app.kubernetes.io/part-of: project-pn
    spec:
      restartPolicy: Always
      serviceAccountName: pn-workload-sa
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: backend
          image: ghcr.io/nacfson/project-pn-backend:042e2ca@sha256:db643803a5fb5eec18c6dfaeee5f6da3c48e543992faa1a6cb75289c4dc5417e
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          workingDir: /app
          env:
            - name: DATABASE_URL
              value: "postgres://project%3Apn%3Aworkload%3Abackend:project%3Apn%3Aworkload%3Abackend@vault-db-proxy.vault.svc:5432/proj_pn?sslmode=disable"
            - name: DB_HOST
              value: "vault-db-proxy.vault.svc"
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              value: "proj_pn"
            - name: DB_USER
              value: "project:pn:workload:backend"
            - name: DB_TOKEN
              value: "project:pn:workload:backend"
            - name: MIGRATIONS_PATH
              value: "file:///app/db/migrations"
            - name: AUTH_JWT_JWKS_URL
              value: "http://gateway.identity.svc:8080/realms/platform/protocol/openid-connect/certs"
            - name: CENTRAL_AUTH_INTERNAL_URL
              value: "http://gateway.identity.svc:8080/realms/platform"
            - name: CENTRAL_AUTH_URL
              value: "https://auth.example.com/realms/platform"
            - name: PORT
              value: "8080"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: "300m"
              memory: "512Mi"
            limits:
              cpu: "300m"
              memory: "512Mi"
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: logs
              mountPath: /var/log/project-pn
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
            successThreshold: 1
      volumes:
        - name: tmp
          emptyDir: {}
        - name: logs
          emptyDir: {}
