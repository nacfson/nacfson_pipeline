apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: project-pn-ingress
  namespace: proj-pn
  labels:
    app.kubernetes.io/name: project-pn
    app.kubernetes.io/part-of: project-pn
spec:
  entryPoints:
    - web
    - websecure
  routes:
    # Host route, then /api. Flux match patches address these indexes.
    - match: Host(`pn.example.com`)
      kind: Rule
      priority: 10
      middlewares:
        - name: strip-forged-headers
          namespace: platform
      services:
        - name: pn-frontend
          port: 80
    - match: Host(`pn.example.com`) && PathPrefix(`/api`)
      kind: Rule
      priority: 100
      middlewares:
        - name: strip-forged-headers
          namespace: platform
      services:
        - name: pn-backend
          port: 8080
