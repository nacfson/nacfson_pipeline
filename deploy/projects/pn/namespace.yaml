apiVersion: v1
kind: Namespace
metadata:
  name: proj-pn
  labels:
    app.kubernetes.io/part-of: project-pn
    name: proj-pn
    platform.nacfson.io/project-id: pn
    # Enforce Restricted Pod Security Standard strictly (warn & audit alone are prohibited)
