# cert-manager ACME HTTP-01 solver (see docs/tls-certificates.md).
# While a pn-tls certificate is issued or renewed, cert-manager runs a short-lived
# solver pod in proj-pn that answers /.well-known/acme-challenge/ on port 8089.
# project-pn-isolation admits Traefik only on 80/8080, so this additive policy
# admits Traefik on 8089 to solver pods only. Solver pods need no egress.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-acme-http01-solver
  namespace: proj-pn
  labels:
    app.kubernetes.io/name: project-pn
    app.kubernetes.io/part-of: project-pn
spec:
  podSelector:
    matchLabels:
      acme.cert-manager.io/http01-solver: "true"
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - protocol: TCP
          port: 8089
