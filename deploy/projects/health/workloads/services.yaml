apiVersion: v1
kind: Service
metadata:
  name: health-backend
  namespace: proj-health
  labels:
    app.kubernetes.io/name: health-backend
    app.kubernetes.io/part-of: project-health
spec:
  # Strictly ClusterIP: NodePort and LoadBalancer are perimeter bypasses and strictly rejected
  type: ClusterIP
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP
  selector:
    app.kubernetes.io/name: health-backend
---
apiVersion: v1
kind: Service
metadata:
  name: health-frontend
  namespace: proj-health
  labels:
    app.kubernetes.io/name: health-frontend
    app.kubernetes.io/part-of: project-health
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: 8080
      protocol: TCP
  selector:
    app.kubernetes.io/name: health-frontend
