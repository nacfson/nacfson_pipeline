apiVersion: apps/v1
kind: Deployment
metadata:
  name: health-frontend
  namespace: proj-health
  labels:
    app.kubernetes.io/name: health-frontend
    app.kubernetes.io/part-of: project-health
    platform.nacfson.io/managed-by: platform
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: health-frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: health-frontend
        app.kubernetes.io/part-of: project-health
        app.kubernetes.io/version: "v0.0.0-56011ee"
      annotations:
        logs.nacfson.cloud/frontend: "v3/nginx"
        logs.nacfson.cloud/frontend.data-paths: "/var/log/nginx"
        logs.nacfson.cloud/frontend.data-reason: "nginx scratch directory in read-only rootfs"
    spec:
      restartPolicy: Always
      serviceAccountName: health-workload-sa
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: frontend
          image: ghcr.io/nacfson/health-frontend@sha256:4bc3ba892fa3d3af4500f767c7e0f69cc013de6ac49773fbfd6cfa1187b0ec1d
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "50m"
              memory: "64Mi"
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: nginx-cache
              mountPath: /var/cache/nginx
            - name: nginx-log
              mountPath: /var/log/nginx
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
            successThreshold: 1
          startupProbe:
            httpGet:
              path: /api/auth/config
              port: 8080
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 36
            successThreshold: 1
      volumes:
        - name: tmp
          emptyDir: {}
        - name: nginx-cache
          emptyDir: {}
        - name: nginx-log
          emptyDir: {}
