apiVersion: v1
kind: ResourceQuota
metadata:
  name: project-health-quota
  namespace: proj-health
  labels:
    app.kubernetes.io/name: project-health
    app.kubernetes.io/part-of: project-health
    platform.nacfson.io/managed-by: platform
spec:
  hard:
    requests.cpu: "700m"
    limits.cpu: "700m"
    requests.memory: "768Mi"
    limits.memory: "768Mi"
    pods: "6"
    # Strict perimeter backstops: Reject bypass service types at quota admission level
    services.nodeports: "0"
    services.loadbalancers: "0"
