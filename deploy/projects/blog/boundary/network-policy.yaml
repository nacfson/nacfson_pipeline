apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: project-blog-isolation
  namespace: proj-blog
  labels:
    app.kubernetes.io/name: project-blog
    app.kubernetes.io/part-of: project-blog
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # 1. Door contract: port 8080 from the platform namespace
    - from:
        - namespaceSelector:
            matchLabels:
              name: platform
      ports:
        - protocol: TCP
          port: 8080

    # 2. K3s runs Traefik in kube-system. Admit only those pods, on port 8080
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - protocol: TCP
          port: 8080

  egress:
    # 1. Allow internal cluster DNS (kube-dns)
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53

    # 2. Allow egress to flux-system/source-controller for artifact fetching
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: flux-system
          podSelector:
            matchLabels:
              app: source-controller
      ports:
        - protocol: TCP
          port: 80
        - protocol: TCP
          port: 9090
