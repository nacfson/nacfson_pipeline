apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: vault-default-deny
  namespace: vault
  labels:
    app.kubernetes.io/name: vault-network-policy
    app.kubernetes.io/part-of: platform-vault
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  ingress: []
  egress:
    # Allow DNS resolution
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: openbao-ingress-policy
  namespace: vault
  labels:
    app.kubernetes.io/name: openbao-policy
    app.kubernetes.io/part-of: platform-vault
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: openbao
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow intra-vault cluster traffic (Raft :8201 and API :8200)
    - from:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 8200
        - protocol: TCP
          port: 8201
    # Allow authorized platform services (e.g. identity namespace, provisioning jobs)
    - from:
        - namespaceSelector:
            matchLabels:
              name: identity
      ports:
        - protocol: TCP
          port: 8200
    - from:
        - namespaceSelector:
            matchLabels:
              name: platform
      ports:
        - protocol: TCP
          port: 8200
  egress:
    # Intra-vault clustering & Raft sync
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: openbao
      ports:
        - protocol: TCP
          port: 8201
    # Kubernetes API Server TokenReview egress (auth/kubernetes) — kube-router fallback.
    # K3s kube-router (still active on any node not yet migrated to
    # `--flannel-backend=none --disable-network-policy`) ignores CiliumNetworkPolicy, so
    # without this rule it REJECTs TokenReview and every Vault Kubernetes login fails.
    # kube-proxy DNATs 10.43.0.1:443 to the node IP :6443 before policy evaluation, so the
    # destination is the node's private address; scope to RFC1918 instead of 0.0.0.0/0.
    # Under Cilium, ipBlock never matches node IPs; the CiliumNetworkPolicy below
    # (toEntities: kube-apiserver) is what admits this traffic there.
    - to:
        - ipBlock:
            cidr: 10.0.0.0/8
        - ipBlock:
            cidr: 172.16.0.0/12
        - ipBlock:
            cidr: 192.168.0.0/16
      ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 6443
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: openbao-apiserver-egress
  namespace: vault
  labels:
    app.kubernetes.io/name: openbao-policy
    app.kubernetes.io/part-of: platform-vault
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: openbao
  egress:
    # Kubernetes API Server TokenReview egress (auth/kubernetes)
    - toEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
            - port: "6443"
              protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: openbao-backup-policy
  namespace: vault
  labels:
    app.kubernetes.io/name: openbao-backup-policy
    app.kubernetes.io/part-of: platform-vault
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: openbao-backup
  policyTypes:
    - Egress
  egress:
    # Allow daily Raft snapshot CronJob to reach OpenBao API on port 8200
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: openbao
      ports:
        - protocol: TCP
          port: 8200
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: db-proxy-policy
  namespace: vault
  labels:
    app.kubernetes.io/name: db-proxy-policy
    app.kubernetes.io/part-of: platform-vault
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: vault-db-proxy
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow project pods (e.g. proj-pn) to connect on Postgres port 5432
    - from:
        - namespaceSelector:
            matchLabels:
              app.kubernetes.io/part-of: project-pn
      ports:
        - protocol: TCP
          port: 5432
    - from:
        - namespaceSelector:
            matchLabels:
              name: proj-pn
      ports:
        - protocol: TCP
          port: 5432
    - from:
        - namespaceSelector:
            matchLabels:
              app.kubernetes.io/part-of: project-health
      ports:
        - protocol: TCP
          port: 5432
    - from:
        - namespaceSelector:
            matchLabels:
              name: proj-health
      ports:
        - protocol: TCP
          port: 5432
  egress:
    # Allow connection to OpenBao API
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: openbao
      ports:
        - protocol: TCP
          port: 8200
    # Allow connection to PostgreSQL in identity namespace
    - to:
        - namespaceSelector:
            matchLabels:
              name: identity
          podSelector:
            matchLabels:
              app.kubernetes.io/name: postgres
      ports:
        - protocol: TCP
          port: 5432
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: registry-proxy-policy
  namespace: vault
  labels:
    app.kubernetes.io/name: registry-proxy-policy
    app.kubernetes.io/part-of: platform-vault
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: vault-registry-proxy
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow local node / containerd to pull images on port 5000
    - ports:
        - protocol: TCP
          port: 5000
  egress:
    # Allow connection to OpenBao API
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: openbao
      ports:
        - protocol: TCP
          port: 8200
    # Allow outbound HTTPS to GHCR for image manifests and layer blobs
    - ports:
        - protocol: TCP
          port: 443
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ai-proxy-policy
  namespace: vault
  labels:
    app.kubernetes.io/name: ai-proxy-policy
    app.kubernetes.io/part-of: platform-vault
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: vault-ai-proxy
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow ONLY authorized project backend pods (proj-pn/pn-backend) on TCP 8080
    - from:
        - namespaceSelector:
            matchLabels:
              name: proj-pn
          podSelector:
            matchLabels:
              app.kubernetes.io/name: pn-backend
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: proj-pn
          podSelector:
            matchLabels:
              app.kubernetes.io/name: pn-backend
      ports:
        - protocol: TCP
          port: 8080
  egress:
    # Allow connection to OpenBao API
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: openbao
      ports:
        - protocol: TCP
          port: 8200
    # Allow kube-router fallback to kube-apiserver (RFC1918) for Pod-IP attribution
    - to:
        - ipBlock:
            cidr: 10.0.0.0/8
        - ipBlock:
            cidr: 172.16.0.0/12
        - ipBlock:
            cidr: 192.168.0.0/16
      ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 6443
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: ai-proxy-egress
  namespace: vault
  labels:
    app.kubernetes.io/name: ai-proxy-policy
    app.kubernetes.io/part-of: platform-vault
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: vault-ai-proxy
  egress:
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": kube-system
            "k8s:k8s-app": kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
          rules:
            dns:
              - matchPattern: "*"
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": vault
            "k8s:app.kubernetes.io/name": openbao
      toPorts:
        - ports:
            - port: "8200"
              protocol: TCP
    - toEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
            - port: "6443"
              protocol: TCP
    - toFQDNs:
        - matchName: generativelanguage.googleapis.com
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: notify-proxy-policy
  namespace: vault
  labels:
    app.kubernetes.io/name: notify-proxy-policy
    app.kubernetes.io/part-of: platform-vault
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: vault-notify-proxy
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Only the two pods the grants name may post here. The proxy attributes the
    # caller by pod IP, so this is the second lock on the same door: a pod that
    # reached the port but was not granted a channel still gets 403.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
          podSelector:
            matchLabels:
              app.kubernetes.io/name: error-detector
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
          podSelector:
            matchLabels:
              app.kubernetes.io/name: error-investigator
      ports:
        - protocol: TCP
          port: 8080
  egress:
    # OpenBao holds the Discord webhook URLs; the proxy keeps no secret of its own.
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: openbao
      ports:
        - protocol: TCP
          port: 8200
    # kube-router fallback to kube-apiserver for pod-IP attribution (same as
    # ai-proxy-policy): under Cilium ipBlock never matches node IPs, so the
    # CiliumNetworkPolicy below covers that path.
    - to:
        - ipBlock:
            cidr: 10.0.0.0/8
        - ipBlock:
            cidr: 172.16.0.0/12
        - ipBlock:
            cidr: 192.168.0.0/16
      ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 6443
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: notify-proxy-egress
  namespace: vault
  labels:
    app.kubernetes.io/name: notify-proxy-policy
    app.kubernetes.io/part-of: platform-vault
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: vault-notify-proxy
  egress:
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": kube-system
            "k8s:k8s-app": kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
          rules:
            dns:
              - matchPattern: "*"
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": vault
            "k8s:app.kubernetes.io/name": openbao
      toPorts:
        - ports:
            - port: "8200"
              protocol: TCP
    - toEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
            - port: "6443"
              protocol: TCP
    # Discord only, and by exact name: a wildcard would let a compromised proxy
    # exfiltrate to any Discord-adjacent host, and Cilium would learn it as a
    # DNS name from whatever the proxy asked for.
    - toFQDNs:
        - matchName: discord.com
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
