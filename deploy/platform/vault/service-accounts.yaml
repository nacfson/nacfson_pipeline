apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-db-proxy
  namespace: vault
  labels:
    app.kubernetes.io/name: vault-db-proxy
    app.kubernetes.io/part-of: platform-vault
automountServiceAccountToken: true
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-registry-proxy
  namespace: vault
  labels:
    app.kubernetes.io/name: vault-registry-proxy
    app.kubernetes.io/part-of: platform-vault
automountServiceAccountToken: true
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: openbao-backup
  namespace: vault
  labels:
    app.kubernetes.io/name: openbao-backup
    app.kubernetes.io/part-of: platform-vault
automountServiceAccountToken: true
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: openbao-token-reviewer
  namespace: vault
  labels:
    app.kubernetes.io/name: openbao
    app.kubernetes.io/part-of: platform-vault
automountServiceAccountToken: true
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-ai-proxy
  namespace: vault
  labels:
    app.kubernetes.io/name: vault-ai-proxy
    app.kubernetes.io/part-of: platform-vault
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: vault-ai-proxy-pod-reader
  labels:
    app.kubernetes.io/name: vault-ai-proxy
    app.kubernetes.io/part-of: platform-vault
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: vault-ai-proxy-pod-reader
  labels:
    app.kubernetes.io/name: vault-ai-proxy
    app.kubernetes.io/part-of: platform-vault
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: vault-ai-proxy-pod-reader
subjects:
  - kind: ServiceAccount
    name: vault-ai-proxy
    namespace: vault
