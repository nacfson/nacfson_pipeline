apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: gitops-managed-namespaces
  labels:
    platform.nacfson.io/managed-by: platform
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["*"]
        apiVersions: ["*"]
        operations: ["CREATE", "UPDATE", "DELETE"]
        resources: ["*"]
        scope: Namespaced
  validations:
    - expression: >-
        request.userInfo.username.startsWith('system:serviceaccount:flux-system:') ||
        request.userInfo.username == 'system:serviceaccount:proj-pn:pn-reconciler' ||
        request.userInfo.username == 'system:serviceaccount:proj-health:health-reconciler' ||
        request.userInfo.username.startsWith('system:serviceaccount:kube-system:') ||
        request.userInfo.username.startsWith('system:node:') ||
        request.userInfo.username in ['system:kube-controller-manager', 'system:kube-scheduler', 'system:apiserver', 'system:k3s-controller', 'k3s-cloud-controller-manager'] ||
        (request.userInfo.username.startsWith('system:serviceaccount:cert-manager:') &&
          request.namespace in ['platform', 'cert-manager'] &&
          request.resource.group in ['', 'cert-manager.io', 'acme.cert-manager.io', 'networking.k8s.io', 'events.k8s.io'] &&
          request.resource.resource in ['secrets', 'events', 'pods', 'services', 'ingresses', 'certificates', 'certificaterequests', 'orders', 'challenges']) ||
        'platform:break-glass' in request.userInfo.groups ||
        (request.resource.resource == 'pods' && (!has(request.subResource) || request.subResource == '') && request.operation == 'DELETE') ||
        (request.resource.resource == 'pods' && has(request.subResource) && request.subResource == 'eviction') ||
        (request.resource.resource == 'serviceaccounts' && has(request.subResource) && request.subResource == 'token')
      message: "Manual change rejected: merge to main in github.com/nacfson/nacfson_pipeline, or use the break-glass procedure (operations §12)."
      messageExpression: "'Manual change rejected: merge to main in github.com/nacfson/nacfson_pipeline, or use the break-glass procedure (operations §12).'"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: gitops-managed-namespaces
  labels:
    platform.nacfson.io/managed-by: platform
spec:
  policyName: gitops-managed-namespaces
  validationActions: [Deny]
  matchResources:
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: In
          values:
            - default
            - flux-system
            - governance
            - identity
            - platform
            - vault
            - proj-pn
            - proj-health
            - cert-manager
            - observability
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: gitops-managed-cluster-kinds
  labels:
    platform.nacfson.io/managed-by: platform
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["*"]
        apiVersions: ["*"]
        operations: ["CREATE", "UPDATE", "DELETE"]
        resources:
          - namespaces
          - customresourcedefinitions
          - clusterroles
          - clusterrolebindings
          - validatingadmissionpolicies
          - validatingadmissionpolicybindings
          - validatingwebhookconfigurations
          - mutatingwebhookconfigurations
        scope: Cluster
  validations:
    - expression: >-
        request.userInfo.username.startsWith('system:serviceaccount:flux-system:') ||
        request.userInfo.username == 'system:serviceaccount:proj-pn:pn-reconciler' ||
        request.userInfo.username == 'system:serviceaccount:proj-health:health-reconciler' ||
        request.userInfo.username.startsWith('system:serviceaccount:kube-system:') ||
        request.userInfo.username.startsWith('system:node:') ||
        request.userInfo.username in ['system:kube-controller-manager', 'system:kube-scheduler', 'system:apiserver', 'system:k3s-controller', 'k3s-cloud-controller-manager'] ||
        (request.resource.resource == 'customresourcedefinitions' && (request.name.endsWith('.cattle.io') || request.name.endsWith('.k3s.io'))) ||
        (request.userInfo.username == 'system:serviceaccount:cert-manager:cert-manager-cainjector' &&
          request.operation == 'UPDATE' &&
          request.resource.resource in ['validatingwebhookconfigurations', 'mutatingwebhookconfigurations'] &&
          request.name == 'cert-manager-webhook') ||
        'platform:break-glass' in request.userInfo.groups ||
        (request.resource.resource == 'pods' && (!has(request.subResource) || request.subResource == '') && request.operation == 'DELETE') ||
        (request.resource.resource == 'pods' && has(request.subResource) && request.subResource == 'eviction') ||
        (request.resource.resource == 'serviceaccounts' && has(request.subResource) && request.subResource == 'token')
      message: "Manual change rejected: merge to main in github.com/nacfson/nacfson_pipeline, or use the break-glass procedure (operations §12)."
      messageExpression: "'Manual change rejected: merge to main in github.com/nacfson/nacfson_pipeline, or use the break-glass procedure (operations §12).'"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: gitops-managed-cluster-kinds
  labels:
    platform.nacfson.io/managed-by: platform
spec:
  policyName: gitops-managed-cluster-kinds
  validationActions: [Deny]
