apiVersion: v1
kind: ServiceAccount
metadata:
  name: operator-readonly
  namespace: governance
  labels:
    platform.nacfson.io/managed-by: platform
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: operator-readonly-view
  labels:
    platform.nacfson.io/managed-by: platform
subjects:
  - kind: ServiceAccount
    name: operator-readonly
    namespace: governance
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: view
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: operator-diagnostics
  labels:
    platform.nacfson.io/managed-by: platform
rules:
  - apiGroups: [""]
    resources: ["nodes", "nodes/status"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/portforward"]
    verbs: ["create"]
  - apiGroups: ["metrics.k8s.io"]
    resources: ["nodes", "pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: operator-readonly-diagnostics
  labels:
    platform.nacfson.io/managed-by: platform
subjects:
  - kind: ServiceAccount
    name: operator-readonly
    namespace: governance
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: operator-diagnostics
