apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: identity
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: platform
spec:
  serviceName: postgres-service
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
        app.kubernetes.io/part-of: platform
    spec:
      serviceAccountName: postgres
      securityContext:
        fsGroup: 999
        runAsNonRoot: true
        runAsUser: 999
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: secret-fetcher
          image: curlimages/curl:8.10.1
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          env:
            - name: VAULT_ADDR
              value: "http://openbao-service.vault.svc:8200"
            - name: VAULT_ROLE
              value: "postgres-server"
          command:
            - /bin/sh
            - -c
          args:
            - |
              set -euo pipefail
              echo "Authenticating to Vault via Kubernetes ServiceAccount Token..."
              SA_TOKEN=$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)
              LOGIN_RESP=$(curl -fsSL -X POST "${VAULT_ADDR}/v1/auth/kubernetes/login" \
                -d "{\"jwt\": \"${SA_TOKEN}\", \"role\": \"${VAULT_ROLE}\"}")
              VAULT_TOKEN=$(echo "${LOGIN_RESP}" | sed -n 's/.*"client_token":"\([^"]*\)".*/\1/p')

              echo "Retrieving postgres administrator credentials..."
              SECRET_JSON=$(curl -fsSL -H "X-Vault-Token: ${VAULT_TOKEN}" "${VAULT_ADDR}/v1/kv/data/database/postgres-admin")
              ADMIN_PASS=$(echo "${SECRET_JSON}" | sed -n 's/.*"password":"\([^"]*\)".*/\1/p')

              mkdir -p /var/run/secrets/database
              echo -n "${ADMIN_PASS}" > /var/run/secrets/database/admin_password
              chmod 0400 /var/run/secrets/database/admin_password
              echo "Postgres admin password written to ephemeral storage."
          volumeMounts:
            - name: database-secrets
              mountPath: /var/run/secrets/database
      containers:
        - name: postgres
          image: postgres:16.8-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: postgresql
              containerPort: 5432
              protocol: TCP
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            - name: POSTGRES_PASSWORD_FILE
              value: /var/run/secrets/database/admin_password
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 250m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
          lifecycle:
            postStart:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - |
                    if [ -f /var/lib/postgresql/data/pgdata/pg_hba.conf ] && ! grep -q "host proj_pn user_pn" /var/lib/postgresql/data/pgdata/pg_hba.conf; then
                      sed -i '/host all all all scram-sha-256/i host proj_pn user_pn all trust' /var/lib/postgresql/data/pgdata/pg_hba.conf
                      pg_ctl reload -D /var/lib/postgresql/data/pgdata || true
                    fi
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
            - name: database-secrets
              mountPath: /var/run/secrets/database
              readOnly: true
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - exec pg_isready -U postgres -h 127.0.0.1 -p 5432
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - exec pg_isready -U postgres -h 127.0.0.1 -p 5432
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
      volumes:
        - name: database-secrets
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi
