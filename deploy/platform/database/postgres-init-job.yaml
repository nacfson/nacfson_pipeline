apiVersion: batch/v1
kind: Job
metadata:
  name: postgres-init-job
  namespace: identity
  annotations:
    kustomize.toolkit.fluxcd.io/force: enabled
  labels:
    app.kubernetes.io/name: postgres-init
    app.kubernetes.io/part-of: platform
spec:
  backoffLimit: 5
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres-init
    spec:
      restartPolicy: OnFailure
      serviceAccountName: postgres-init
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: secret-fetcher
          image: curlimages/curl:8.10.1
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          env:
            - name: VAULT_ADDR
              value: "http://openbao-service.vault.svc:8200"
            - name: VAULT_ROLE
              value: "postgres-init"
          command:
            - /bin/sh
            - -c
          args:
            - |
              set -euo pipefail
              echo "Authenticating to Vault via Kubernetes ServiceAccount Token..."
              SA_TOKEN=$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)
              LOGIN_RESP=$(curl -fsSL -X POST "${VAULT_ADDR}/v1/auth/kubernetes/login" \
                -d "{\"jwt\": \"${SA_TOKEN}\", \"role\": \"${VAULT_ROLE}\"}")
              VAULT_TOKEN=$(echo "${LOGIN_RESP}" | sed -n 's/.*"client_token":"\([^"]*\)".*/\1/p')

              mkdir -p /var/run/secrets/database

              echo "Retrieving database role credentials..."
              curl -fsSL -H "X-Vault-Token: ${VAULT_TOKEN}" "${VAULT_ADDR}/v1/kv/data/database/postgres-admin" | \
                sed -n 's/.*"password":"\([^"]*\)".*/\1/p' > /var/run/secrets/database/admin_password

              curl -fsSL -H "X-Vault-Token: ${VAULT_TOKEN}" "${VAULT_ADDR}/v1/kv/data/database/keycloak-user" | \
                sed -n 's/.*"password":"\([^"]*\)".*/\1/p' > /var/run/secrets/database/keycloak_password

              curl -fsSL -H "X-Vault-Token: ${VAULT_TOKEN}" "${VAULT_ADDR}/v1/kv/data/database/pn-user" | \
                sed -n 's/.*"password":"\([^"]*\)".*/\1/p' > /var/run/secrets/database/pn_password

              curl -fsSL -H "X-Vault-Token: ${VAULT_TOKEN}" "${VAULT_ADDR}/v1/kv/data/database/backup-user" | \
                sed -n 's/.*"password":"\([^"]*\)".*/\1/p' > /var/run/secrets/database/backup_password

              chmod 0400 /var/run/secrets/database/*
              echo "All database credentials populated into ephemeral storage."
          volumeMounts:
            - name: database-secrets
              mountPath: /var/run/secrets/database
      containers:
        - name: init-db
          image: postgres:16.8-alpine
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 100m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          env:
            - name: PGHOST
              value: postgres-service.identity.svc
            - name: PGPORT
              value: "5432"
            - name: PGDATABASE
              value: postgres
            - name: PGUSER
              value: postgres
            - name: VAULT_ADDR
              value: "http://openbao-service.vault.svc:8200"
          command:
            - /bin/sh
            - -c
            - |
              set -e
              echo "Fetching credentials from Vault ephemeral storage..."
              if [ -f /var/run/secrets/database/admin_password ]; then
                export PGPASSWORD=$(cat /var/run/secrets/database/admin_password)
              fi
              if [ -f /var/run/secrets/database/keycloak_password ]; then
                KEYCLOAK_DB_PASSWORD=$(cat /var/run/secrets/database/keycloak_password)
              fi
              if [ -f /var/run/secrets/database/pn_password ]; then
                PROJ_PN_DB_PASSWORD=$(cat /var/run/secrets/database/pn_password)
              fi
              if [ -f /var/run/secrets/database/backup_password ]; then
                BACKUP_DB_PASSWORD=$(cat /var/run/secrets/database/backup_password)
              fi

              # Direct Vault fallback if token present
              if [ -z "${PGPASSWORD:-}" ] && [ -n "${VAULT_TOKEN:-}" ]; then
                PGPASSWORD=$(wget -qO- --header="X-Vault-Token: ${VAULT_TOKEN}" ${VAULT_ADDR}/v1/kv/data/database/postgres-admin | grep -o '"password":"[^"]*"' | cut -d'"' -f4)
                KEYCLOAK_DB_PASSWORD=$(wget -qO- --header="X-Vault-Token: ${VAULT_TOKEN}" ${VAULT_ADDR}/v1/kv/data/database/keycloak-user | grep -o '"password":"[^"]*"' | cut -d'"' -f4)
                PROJ_PN_DB_PASSWORD=$(wget -qO- --header="X-Vault-Token: ${VAULT_TOKEN}" ${VAULT_ADDR}/v1/kv/data/database/pn-user | grep -o '"password":"[^"]*"' | cut -d'"' -f4)
                BACKUP_DB_PASSWORD=$(wget -qO- --header="X-Vault-Token: ${VAULT_TOKEN}" ${VAULT_ADDR}/v1/kv/data/database/backup-user | grep -o '"password":"[^"]*"' | cut -d'"' -f4)
              fi

              echo "Waiting for PostgreSQL service to be ready..."
              until pg_isready -h "$PGHOST" -p "$PGPORT" -U "$PGUSER"; do
                sleep 2
              done
              echo "PostgreSQL is ready. Running idempotent database & role provisioning..."

              psql -v ON_ERROR_STOP=1 <<-EOSQL
                -- Provision Keycloak Role & Database
                DO \$\$
                BEGIN
                  IF NOT EXISTS (SELECT FROM pg_catalog.pg_roles WHERE rolname = 'keycloak_user') THEN
                    CREATE ROLE keycloak_user WITH LOGIN PASSWORD '${KEYCLOAK_DB_PASSWORD}';
                  ELSE
                    ALTER ROLE keycloak_user WITH PASSWORD '${KEYCLOAK_DB_PASSWORD}';
                  END IF;
                END
                \$\$;

                SELECT 'CREATE DATABASE keycloak OWNER keycloak_user'
                WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'keycloak')\gexec

                -- Provision Project PN Role & Database
                DO \$\$
                BEGIN
                  IF NOT EXISTS (SELECT FROM pg_catalog.pg_roles WHERE rolname = 'user_pn') THEN
                    CREATE ROLE user_pn WITH LOGIN PASSWORD '${PROJ_PN_DB_PASSWORD}';
                  ELSE
                    ALTER ROLE user_pn WITH PASSWORD '${PROJ_PN_DB_PASSWORD}';
                  END IF;
                END
                \$\$;

                SELECT 'CREATE DATABASE proj_pn OWNER user_pn'
                WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'proj_pn')\gexec

                -- Provision Dedicated Backup Role (Least Privilege pg_read_all_data)
                DO \$\$
                BEGIN
                  IF NOT EXISTS (SELECT FROM pg_catalog.pg_roles WHERE rolname = 'backup_role') THEN
                    CREATE ROLE backup_role WITH LOGIN PASSWORD '${BACKUP_DB_PASSWORD}';
                  ELSE
                    ALTER ROLE backup_role WITH PASSWORD '${BACKUP_DB_PASSWORD}';
                  END IF;
                END
                \$\$;
                GRANT pg_read_all_data TO backup_role;
                REVOKE CREATE, TEMPORARY ON DATABASE keycloak, proj_pn FROM backup_role;

                -- Enforce strict database isolation
                REVOKE ALL ON DATABASE keycloak FROM PUBLIC;
                REVOKE ALL ON DATABASE proj_pn FROM PUBLIC;
                REVOKE CONNECT ON DATABASE keycloak FROM user_pn;
                REVOKE CONNECT ON DATABASE proj_pn FROM keycloak_user;
                GRANT CONNECT ON DATABASE keycloak TO keycloak_user;
                GRANT CONNECT ON DATABASE proj_pn TO user_pn;
                GRANT CONNECT ON DATABASE keycloak TO backup_role;
                GRANT CONNECT ON DATABASE proj_pn TO backup_role;
              EOSQL

              # Clear secrets from memory immediately upon completion
              unset PGPASSWORD KEYCLOAK_DB_PASSWORD PROJ_PN_DB_PASSWORD BACKUP_DB_PASSWORD
              echo "Database and role provisioning completed successfully."
          volumeMounts:
            - name: database-secrets
              mountPath: /var/run/secrets/database
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: database-secrets
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
        - name: tmp
          emptyDir: {}
