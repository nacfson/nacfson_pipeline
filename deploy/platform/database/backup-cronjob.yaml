apiVersion: batch/v1
kind: CronJob
metadata:
  name: postgres-daily-backup
  namespace: identity
  labels:
    app.kubernetes.io/name: postgres-backup
    app.kubernetes.io/part-of: platform-identity
    platform.nacfson.io/managed-by: platform
spec:
  schedule: "0 0 * * *"
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app.kubernetes.io/name: postgres-backup
        spec:
          automountServiceAccountToken: false
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
            runAsGroup: 999
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: pg-backup
              image: postgres:16-alpine
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
              command:
                - /bin/sh
                - -c
                - |
                  set -euo pipefail

                  # 1. Fetch credentials from ephemeral memory mount or Vault KV
                  if [ -f /var/run/secrets/database/backup_password ]; then
                    export PGPASSWORD=$(cat /var/run/secrets/database/backup_password)
                  elif [ -n "${VAULT_TOKEN:-}" ]; then
                    export PGPASSWORD=$(wget -qO- --header="X-Vault-Token: ${VAULT_TOKEN}" ${VAULT_ADDR}/v1/kv/data/database/backup-user | grep -o '"password":"[^"]*"' | cut -d'"' -f4)
                  fi

                  if [ -z "${PGPASSWORD:-}" ]; then
                    echo "Error: Backup role password could not be loaded from Vault."
                    exit 1
                  fi

                  TIMESTAMP=$(date +%Y%m%d_%H%M%S)
                  BACKUP_FILE="/backups/pg_dumpall_${TIMESTAMP}.sql.gz"
                  echo "Starting logical cluster backup as dedicated least-privilege 'backup_role' to ${BACKUP_FILE}..."
                  
                  pg_dumpall -h "$PGHOST" -p "$PGPORT" -U "$PGUSER" | gzip > "${BACKUP_FILE}"
                  
                  # Immediately clear password from process memory
                  unset PGPASSWORD
                  echo "Backup completed successfully."
                  
                  echo "Pruning archives older than 7 days..."
                  find /backups -name "pg_dumpall_*.sql.gz" -type f -mtime +7 -delete
                  echo "Retention enforcement complete."
              env:
                - name: PGHOST
                  value: "postgres-service.identity.svc"
                - name: PGPORT
                  value: "5432"
                - name: PGUSER
                  value: "backup_role"
                - name: VAULT_ADDR
                  value: "http://openbao.vault.svc:8200"
              resources:
                requests:
                  cpu: "100m"
                  memory: "128Mi"
                limits:
                  cpu: "100m"
                  memory: "128Mi"
              volumeMounts:
                - name: backup-storage
                  mountPath: /backups
                - name: database-secrets
                  mountPath: /var/run/secrets/database
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: backup-storage
              persistentVolumeClaim:
                claimName: postgres-backup-pvc
            - name: database-secrets
              emptyDir:
                medium: Memory
                sizeLimit: 1Mi
            - name: tmp
              emptyDir: {}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-backup-pvc
  namespace: identity
  labels:
    app.kubernetes.io/name: postgres-backup
    app.kubernetes.io/part-of: platform-identity
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
