apiVersion: apps/v1
kind: Deployment
metadata:
  name: vault-registry-proxy
  namespace: vault
  labels:
    app.kubernetes.io/name: vault-registry-proxy
    app.kubernetes.io/part-of: platform-vault
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: vault-registry-proxy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vault-registry-proxy
        app.kubernetes.io/part-of: platform-vault
    spec:
      serviceAccountName: vault-registry-proxy
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: proxy
          image: ghcr.io/nacfson/vault-registry-proxy:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 5000
              protocol: TCP
          env:
            - name: PORT
              value: "5000"
            - name: UPSTREAM_REGISTRY
              value: "ghcr.io"
            - name: VAULT_ADDR
              value: "http://openbao-service.vault.svc:8200"
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          readinessProbe:
            httpGet:
              path: /healthz
              port: 5000
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: vault-registry-proxy
  namespace: vault
  labels:
    app.kubernetes.io/name: vault-registry-proxy
    app.kubernetes.io/part-of: platform-vault
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 5000
      targetPort: 5000
      protocol: TCP
  selector:
    app.kubernetes.io/name: vault-registry-proxy
