apiVersion: apps/v1
kind: Deployment
metadata:
  name: vault-db-proxy
  namespace: vault
  labels:
    app.kubernetes.io/name: vault-db-proxy
    app.kubernetes.io/part-of: platform-vault
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: vault-db-proxy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vault-db-proxy
        app.kubernetes.io/part-of: platform-vault
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: db-proxy
          image: ghcr.io/nacfson/vault-db-proxy:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: postgresql
              containerPort: 5432
              protocol: TCP
            - name: health
              containerPort: 8080
              protocol: TCP
          env:
            - name: PORT
              value: "5432"
            - name: HEALTH_PORT
              value: "8080"
            - name: UPSTREAM_PG_HOST
              value: "postgres-service.identity.svc"
            - name: UPSTREAM_PG_PORT
              value: "5432"
            - name: ENFORCED_DB
              value: "proj_pn"
            - name: ENFORCED_ROLE
              value: "user_pn"
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: vault-db-proxy
  namespace: vault
  labels:
    app.kubernetes.io/name: vault-db-proxy
    app.kubernetes.io/part-of: platform-vault
spec:
  type: ClusterIP
  ports:
    - name: postgresql
      port: 5432
      targetPort: 5432
      protocol: TCP
  selector:
    app.kubernetes.io/name: vault-db-proxy
