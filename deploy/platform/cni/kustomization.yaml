apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - upstream/cilium.yaml

patches:
  - target:
      kind: ConfigMap
      name: cilium-config
      namespace: kube-system
    patch: |
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: cilium-config
        namespace: kube-system
      data:
        unmanaged-pod-watcher-interval: "0"
        policy-cidr-match-mode: "nodes"
  - target:
      kind: DaemonSet
      name: cilium
      namespace: kube-system
    patch: |
      apiVersion: apps/v1
      kind: DaemonSet
      metadata:
        name: cilium
        namespace: kube-system
      spec:
        template:
          spec:
            initContainers:
              - name: config
                resources:
                  requests:
                    cpu: "10m"
                    memory: "16Mi"
                  limits:
                    cpu: "100m"
                    memory: "64Mi"
              - name: mount-cgroup
                resources:
                  requests:
                    cpu: "10m"
                    memory: "16Mi"
                  limits:
                    cpu: "100m"
                    memory: "64Mi"
              - name: apply-sysctl-overwrites
                resources:
                  requests:
                    cpu: "10m"
                    memory: "16Mi"
                  limits:
                    cpu: "100m"
                    memory: "64Mi"
              - name: mount-bpf-fs
                resources:
                  requests:
                    cpu: "10m"
                    memory: "16Mi"
                  limits:
                    cpu: "100m"
                    memory: "64Mi"
              - name: clean-cilium-state
                resources:
                  requests:
                    cpu: "10m"
                    memory: "16Mi"
                  limits:
                    cpu: "100m"
                    memory: "64Mi"
              - name: install-cni-binaries
                resources:
                  requests:
                    cpu: "10m"
                    memory: "16Mi"
                  limits:
                    cpu: "100m"
                    memory: "64Mi"
            containers:
              - name: cilium-agent
                resources:
                  requests:
                    cpu: "100m"
                    memory: "192Mi"
                  limits:
                    cpu: "500m"
                    memory: "384Mi"
  - target:
      kind: Deployment
      name: cilium-operator
      namespace: kube-system
    patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: cilium-operator
        namespace: kube-system
      spec:
        template:
          metadata:
            annotations:
              platform.nacfson.io/cilium-config-rev: "2026-10-17-unmanaged-pod-watcher-off"
          spec:
            containers:
              - name: cilium-operator
                resources:
                  requests:
                    cpu: "25m"
                    memory: "64Mi"
                  limits:
                    cpu: "200m"
                    memory: "192Mi"
  - target:
      kind: Deployment
      name: hubble-relay
      namespace: kube-system
    patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: hubble-relay
        namespace: kube-system
      spec:
        template:
          spec:
            containers:
              - name: hubble-relay
                resources:
                  requests:
                    cpu: "15m"
                    memory: "48Mi"
                  limits:
                    cpu: "150m"
                    memory: "128Mi"
  - target:
      kind: Deployment
      name: hubble-ui
      namespace: kube-system
    patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: hubble-ui
        namespace: kube-system
      spec:
        template:
          spec:
            containers:
              - name: frontend
                resources:
                  requests:
                    cpu: "10m"
                    memory: "32Mi"
                  limits:
                    cpu: "100m"
                    memory: "64Mi"
              - name: backend
                env:
                  - name: EVENTS_SERVER_PORT
                    value: "8090"
                  - name: FLOWS_API_ADDR
                    value: "hubble-relay:4245"
                resources:
                  requests:
                    cpu: "15m"
                    memory: "48Mi"
                  limits:
                    cpu: "100m"
                    memory: "96Mi"
