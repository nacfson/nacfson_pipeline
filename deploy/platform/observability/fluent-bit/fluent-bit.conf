[SERVICE]
    Log_Level warn
    Parsers_File parsers.conf
    storage.path /state/chunks
    storage.sync normal
    storage.checksum off
    storage.max_chunks_up 128

[INPUT]
    Name tail
    Path /var/log/pods/proj-*_*/*/*.log
    Path_Key filepath
    Tag proj.*
    multiline.parser cri
    Read_from_Head On
    DB /state/tail.db
    storage.type filesystem
    Mem_Buf_Limit 5MB
    Skip_Long_Lines On

[FILTER]
    Name multiline
    Match proj.*
    multiline.key_content log
    multiline.parser go, python, java
    buffer on
    emitter_storage.type filesystem
    emitter_mem_buf_limit 4M

[FILTER]
    Name parser
    Match proj.*
    Key_Name filepath
    Parser pod_path
    Reserve_Data On

[FILTER]
    Name parser
    Match proj.*
    Key_Name log
    Parser json
    Reserve_Data On
    Preserve_Key On

[FILTER]
    Name lua
    Match proj.*
    script /fluent-bit/etc/log_contract.lua
    call process

[FILTER]
    Name rewrite_tag
    Match proj.*
    Rule $_route ^quarantine$ quarantine.$TAG false
    Emitter_Name rt_quarantine
    Emitter_Storage.type filesystem
    Emitter_Mem_Buf_Limit 4M

[FILTER]
    Name modify
    Match *
    Remove _route

[OUTPUT]
    Name http
    Match proj.*
    Host victorialogs.observability.svc.cluster.local
    Port 9428
    URI /insert/jsonline?_stream_fields=k8s.namespace.name,k8s.pod.name,k8s.container.name&_msg_field=msg&_time_field=_time
    Header AccountID 0
    Header ProjectID 0
    Format json_lines
    json_date_format iso8601
    json_date_key _time
    Retry_Limit 5
    storage.total_limit_size 192M

[OUTPUT]
    Name http
    Match quarantine.*
    Host victorialogs.observability.svc.cluster.local
    Port 9428
    URI /insert/jsonline?_stream_fields=k8s.namespace.name,k8s.pod.name,k8s.container.name&_msg_field=msg&_time_field=_time
    Header AccountID 0
    Header ProjectID 1
    Format json_lines
    json_date_format iso8601
    json_date_key _time
    Retry_Limit 5
    storage.total_limit_size 64M
