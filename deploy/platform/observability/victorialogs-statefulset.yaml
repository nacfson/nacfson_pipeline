apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: victorialogs
  labels:
    app.kubernetes.io/name: victorialogs
    app.kubernetes.io/part-of: platform-observability
spec:
  serviceName: victorialogs
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: victorialogs
  template:
    metadata:
      labels:
        app.kubernetes.io/name: victorialogs
        app.kubernetes.io/part-of: platform-observability
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: victorialogs
          image: victoriametrics/victoria-logs:v1.53.0
          imagePullPolicy: IfNotPresent
          args:
            - -storageDataPath=/victoria-logs-data
            - -httpListenAddr=:9428
            - -retentionPeriod=30d
            - -retention.maxDiskSpaceUsageBytes=8589934592
          ports:
            - name: http
              containerPort: 9428
              protocol: TCP
          resources:
            requests:
              cpu: 50m
              memory: 384Mi
            limits:
              cpu: 500m
              memory: 384Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: data
              mountPath: /victoria-logs-data
          readinessProbe:
            httpGet:
              path: /health
              port: 9428
              scheme: HTTP
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 9428
              scheme: HTTP
            initialDelaySeconds: 30
            periodSeconds: 15
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app.kubernetes.io/name: victorialogs
          app.kubernetes.io/part-of: platform-observability
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 10Gi
