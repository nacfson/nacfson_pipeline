apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: observability-default-deny
  labels:
    app.kubernetes.io/name: observability-network-policy
    app.kubernetes.io/part-of: platform-observability
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  ingress: []
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchExpressions:
              - key: k8s-app
                operator: In
                values:
                  - kube-dns
                  - node-local-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: victorialogs-ingress
  labels:
    app.kubernetes.io/name: victorialogs-policy
    app.kubernetes.io/part-of: platform-observability
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: victorialogs
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: fluent-bit
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: error-detector
      ports:
        - protocol: TCP
          port: 9428
---
