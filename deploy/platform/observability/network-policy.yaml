---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: error-detector-egress
  labels:
    app.kubernetes.io/name: error-detector-policy
    app.kubernetes.io/part-of: platform-observability
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: error-detector
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchExpressions:
              - key: k8s-app
                operator: In
                values:
                  - kube-dns
                  - node-local-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: victorialogs
      ports:
        - protocol: TCP
          port: 9428
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: vault
          podSelector:
            matchLabels:
              app.kubernetes.io/name: vault-notify-proxy
      ports:
        - protocol: TCP
          port: 8080
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: error-investigator
      ports:
        - protocol: TCP
          port: 8080
