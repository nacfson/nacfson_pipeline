apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: observability-default-deny
  labels:
    app.kubernetes.io/name: observability-network-policy
    app.kubernetes.io/part-of: platform-observability
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  ingress: []
  egress:
    # Allow DNS resolution (copied from vault-default-deny)
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: victorialogs-ingress
  labels:
    app.kubernetes.io/name: victorialogs-policy
    app.kubernetes.io/part-of: platform-observability
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: victorialogs
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: fluent-bit
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: error-detector
      ports:
        - protocol: TCP
          port: 9428
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: fluent-bit-egress
  labels:
    app.kubernetes.io/name: fluent-bit-policy
    app.kubernetes.io/part-of: platform-observability
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: fluent-bit
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: victorialogs
      ports:
        - protocol: TCP
          port: 9428
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: error-detector-egress
  labels:
    app.kubernetes.io/name: error-detector-policy
    app.kubernetes.io/part-of: platform-observability
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: error-detector
  policyTypes:
    - Egress
  egress:
    # DNS first: every peer below is named by Service, so nothing resolves
    # without it.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # The tail and catch-up queries.
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: victorialogs
      ports:
        - protocol: TCP
          port: 9428
    # #errors alerts. The proxy owns the Discord URL; the detector never sees it.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: vault
          podSelector:
            matchLabels:
              app.kubernetes.io/name: vault-notify-proxy
      ports:
        - protocol: TCP
          port: 8080
    # The investigator handoff. Empty INVESTIGATOR_URL today, but the door is
    # declared so enabling workstream 3 is a config change, not a policy change.
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: error-investigator
      ports:
        - protocol: TCP
          port: 8080
