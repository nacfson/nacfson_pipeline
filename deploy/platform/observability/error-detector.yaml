apiVersion: v1
kind: ServiceAccount
metadata:
  name: error-detector
  namespace: observability
  labels:
    app.kubernetes.io/name: error-detector
    app.kubernetes.io/part-of: platform-observability
automountServiceAccountToken: false
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: error-detector-state
  namespace: observability
  labels:
    app.kubernetes.io/name: error-detector
    app.kubernetes.io/part-of: platform-observability
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: error-detector
  namespace: observability
  labels:
    app.kubernetes.io/name: error-detector
    app.kubernetes.io/part-of: platform-observability
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: error-detector
  template:
    metadata:
      labels:
        app.kubernetes.io/name: error-detector
        app.kubernetes.io/part-of: platform-observability
    spec:
      restartPolicy: Always
      serviceAccountName: error-detector
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: error-detector
          image: ghcr.io/nacfson/error-detector@sha256:d8cc66fdcb31dd11a14fe7b5cec7b2bbb4f963d34aa72ea278c12feee2994895
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: LISTEN_ADDR
              value: "0.0.0.0:8080"
            - name: VLOGS_URL
              value: "http://victorialogs.observability.svc:9428"
            - name: NOTIFY_URL
              value: "http://notify-gateway.vault.svc:8080"
            - name: INVESTIGATOR_URL
              value: ""
            - name: STATE_PATH
              value: "/state/detector.json"
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 50m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: state
              mountPath: /state
          startupProbe:
            httpGet:
              path: /startupz
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 3
            timeoutSeconds: 2
            failureThreshold: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 15
            timeoutSeconds: 15
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
      volumes:
        - name: state
          persistentVolumeClaim:
            claimName: error-detector-state
