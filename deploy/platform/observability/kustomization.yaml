apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: observability

resources:
  - namespace.yaml
  - network-policy.yaml
  - victorialogs-statefulset.yaml
  - victorialogs-service.yaml
  - fluent-bit-serviceaccount.yaml
  - fluent-bit-daemonset.yaml
  - error-detector.yaml

configMapGenerator:
  - name: fluent-bit-config
    files:
      - fluent-bit/fluent-bit.conf
      - fluent-bit/parsers.conf
      - fluent-bit/log_contract.lua
      - fluent-bit/legacy-containers.txt

generatorOptions:
  disableNameSuffixHash: true
