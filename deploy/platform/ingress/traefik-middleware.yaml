apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: forward-auth
  namespace: platform
  labels:
    app.kubernetes.io/part-of: platform
spec:
  forwardAuth:
    address: http://gateway.identity.svc:8080/auth
    trustForwardHeader: true
    authResponseHeaders:
      - "Authorization"
      - "X-User-Subject"
      - "X-User-Issuer"
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: strip-forged-headers
  namespace: platform
  labels:
    app.kubernetes.io/part-of: platform
spec:
  headers:
    customRequestHeaders:
      X-User-Subject: ""
      X-User-Issuer: ""
      Authorization: ""
