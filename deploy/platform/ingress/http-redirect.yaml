apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: http-to-https
  namespace: platform
  labels:
    app.kubernetes.io/name: http-to-https
    app.kubernetes.io/part-of: platform
spec:
  entryPoints:
    - web
  routes:
    - match: PathPrefix(`/`)
      kind: Rule
      priority: 1
      middlewares:
        - name: redirect-to-https
          namespace: platform
      services:
        - name: noop@internal
          kind: TraefikService
