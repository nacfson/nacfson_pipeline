# Port 80 (entryPoint "web") only redirects to HTTPS.
# All application routes listen on "websecure" with a cert-manager certificate.
# Priority 1 keeps this below every other router, so cert-manager's temporary
# ACME HTTP-01 solver Ingress (/.well-known/acme-challenge/...) still wins on port 80.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: http-to-https
  namespace: platform
  labels:
    app.kubernetes.io/name: http-to-https
    app.kubernetes.io/part-of: platform
spec:
  entryPoints:
    - web
  routes:
    - match: PathPrefix(`/`)
      kind: Rule
      priority: 1
      middlewares:
        - name: redirect-to-https
          namespace: platform
      services:
        - name: noop@internal
          kind: TraefikService
