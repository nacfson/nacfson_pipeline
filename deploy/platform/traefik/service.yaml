apiVersion: v1
kind: Service
metadata:
  name: traefik
  namespace: platform
  labels:
    app.kubernetes.io/name: traefik
    app.kubernetes.io/part-of: platform
  annotations:
    networking.gke.io/load-balancer-ip-addresses: gke-ingress-ip
spec:
  type: LoadBalancer
  loadBalancerClass: networking.gke.io/l4-regional-external
  externalTrafficPolicy: Local
  ports:
    - name: web
      port: 80
      targetPort: 8000
      protocol: TCP
    - name: websecure
      port: 443
      targetPort: 8443
      protocol: TCP
  selector:
    app.kubernetes.io/name: traefik
