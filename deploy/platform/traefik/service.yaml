apiVersion: v1
kind: Service
metadata:
  name: traefik
  namespace: platform
  labels:
    app.kubernetes.io/name: traefik
    app.kubernetes.io/part-of: platform
  annotations:
    # Reserved regional address owned by infra/gcp/gke (referenced by name, not IP).
    networking.gke.io/load-balancer-ip-addresses: gke-ingress-ip
spec:
  # The only LoadBalancer on gke: a GKE-managed L4 pass-through load balancer. TLS stays at Traefik.
  # Contract: specs/015-gke-terraform-infra/contracts/traefik-l4-edge.md
  type: LoadBalancer
  loadBalancerClass: networking.gke.io/l4-regional-external
  # Keep visitor IPs; only the node running Traefik passes the load balancer health check.
  externalTrafficPolicy: Local
  ports:
    - name: web
      port: 80
      targetPort: 8000
      protocol: TCP
    - name: websecure
      port: 443
      targetPort: 8443
      protocol: TCP
  selector:
    app.kubernetes.io/name: traefik
