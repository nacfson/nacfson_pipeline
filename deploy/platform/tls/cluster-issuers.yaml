---
# Self-signed issuer: default for base/local, needs no internet access.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: selfsigned
  labels:
    app.kubernetes.io/part-of: platform
spec:
  selfSigned: {}
---
# Local rehearsal root CA: exportable once for Android emulator / iOS simulator trust.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: local-rehearsal-root-ca
  namespace: cert-manager
  labels:
    app.kubernetes.io/part-of: platform
spec:
  isCA: true
  commonName: nacfson local-k3s rehearsal root
  secretName: local-rehearsal-root-ca
  duration: 87600h
  renewBefore: 8760h
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: selfsigned
---
# CA issuer backed by local-rehearsal-root-ca so auth.example.com and health.example.com share one root.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: local-rehearsal-ca
  labels:
    app.kubernetes.io/part-of: platform
spec:
  ca:
    secretName: local-rehearsal-root-ca
---
# Let's Encrypt staging: untrusted certificates, generous rate limits.
# Use it to debug challenges before switching an environment to production.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
  labels:
    app.kubernetes.io/part-of: platform
spec:
  acme:
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    email: nacfson@icloud.com
    privateKeySecretRef:
      name: letsencrypt-staging-account
    solvers:
      - http01:
          ingress:
            ingressClassName: traefik
            # cert-manager defaults solver to NodePort; Principle II
            # forbids node ports
            serviceType: ClusterIP
---
# Let's Encrypt production: browser-trusted certificates.
# HTTP-01 needs the hostname to resolve to the node and port 80 open
# to the internet.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
  labels:
    app.kubernetes.io/part-of: platform
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: nacfson@icloud.com
    privateKeySecretRef:
      name: letsencrypt-prod-account
    solvers:
      - http01:
          ingress:
            ingressClassName: traefik
            # cert-manager defaults solver to NodePort; Principle II
            # forbids node ports
            serviceType: ClusterIP
