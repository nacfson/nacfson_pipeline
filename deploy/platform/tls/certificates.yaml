---

apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: auth-tls
  namespace: platform
  labels:
    app.kubernetes.io/part-of: platform
spec:
  secretName: auth-tls
  renewBefore: 720h
  dnsNames:
    - auth.example.com
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: local-rehearsal-ca
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
