---
# All edge certificates live in namespace platform and are served through
# TLSStore platform/default (tls-store.yaml). Projects never hold TLS objects.
# Flux patches index 0 of spec.dnsNames and spec.issuerRef.name per environment.

# Served through TLSStore platform/default
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: auth-tls
  namespace: platform
  labels:
    app.kubernetes.io/part-of: platform
spec:
  secretName: auth-tls
  # renew when 30 days remain (FR-006), independent of CA lifetime
  renewBefore: 720h
  dnsNames:
    - auth.example.com
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: local-rehearsal-ca
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
---
# Served through TLSStore platform/default
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: pn-tls
  namespace: platform
  labels:
    app.kubernetes.io/part-of: platform
spec:
