apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: identity
  labels:
    app.kubernetes.io/name: gateway
    app.kubernetes.io/part-of: platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gateway
        app.kubernetes.io/part-of: platform
    spec:
      serviceAccountName: gateway
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: secret-fetcher
          image: curlimages/curl:8.10.1
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          env:
            - name: VAULT_ADDR
              value: "http://openbao-service.vault.svc:8200"
            - name: VAULT_ROLE
              value: "gateway"
          command:
            - /bin/sh
            - -c
          args:
            - |
              set -euo pipefail
              echo "Authenticating to Vault via Kubernetes ServiceAccount Token..."
              SA_TOKEN=$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)
              LOGIN_RESP=$(curl -fsSL -X POST "${VAULT_ADDR}/v1/auth/kubernetes/login" \
                -d "{\"jwt\": \"${SA_TOKEN}\", \"role\": \"${VAULT_ROLE}\"}")
              VAULT_TOKEN=$(echo "${LOGIN_RESP}" | sed -n 's/.*"client_token":"\([^"]*\)".*/\1/p')

              mkdir -p /var/run/secrets/gateway

              echo "Retrieving gateway secrets from Vault..."
              curl -fsSL -H "X-Vault-Token: ${VAULT_TOKEN}" "${VAULT_ADDR}/v1/kv/data/gateway/hmac-secret" | \
                sed -n 's/.*"hmac_secret":"\([^"]*\)".*/\1/p' > /var/run/secrets/gateway/hmac

              curl -fsSL -H "X-Vault-Token: ${VAULT_TOKEN}" "${VAULT_ADDR}/v1/kv/data/gateway/client-secret" | \
                sed -n 's/.*"client_secret":"\([^"]*\)".*/\1/p' > /var/run/secrets/gateway/client_secret

              curl -fsSL -H "X-Vault-Token: ${VAULT_TOKEN}" "${VAULT_ADDR}/v1/kv/data/gateway/session-revocation-secret" | \
                sed -n 's/.*"client_secret":"\([^"]*\)".*/\1/p' > /var/run/secrets/gateway/session_revocation_secret

              chmod 0400 /var/run/secrets/gateway/*
              echo "Gateway secrets populated into ephemeral storage."
          volumeMounts:
            - name: gateway-secrets
              mountPath: /var/run/secrets/gateway
      containers:
        - name: gateway
          image: ghcr.io/nacfson/platform-auth-gateway:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: GATEWAY_PORT
              value: "8080"
            - name: KEYCLOAK_ISSUER_URL
              value: "http://keycloak-service.identity.svc:8080/realms/platform"
            - name: KEYCLOAK_ADMIN_URL
              value: "http://keycloak-service.identity.svc:8080"
            - name: COOKIE_DOMAIN
              value: ".example.com"
            - name: COOKIE_NAME
              value: "PLATFORM_SESSION"
            - name: GATEWAY_CLIENT_ID
              value: "gateway-client"
            - name: GATEWAY_HMAC_SECRET_FILE
              value: "/var/run/secrets/gateway/hmac"
            - name: GATEWAY_CLIENT_SECRET_FILE
              value: "/var/run/secrets/gateway/client_secret"
            - name: SESSION_REVOCATION_CLIENT_SECRET_FILE
              value: "/var/run/secrets/gateway/session_revocation_secret"
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: gateway-secrets
              mountPath: /var/run/secrets/gateway
              readOnly: true
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
      volumes:
        - name: gateway-secrets
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: identity
  labels:
    app.kubernetes.io/name: gateway
    app.kubernetes.io/part-of: platform
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP
  selector:
    app.kubernetes.io/name: gateway
