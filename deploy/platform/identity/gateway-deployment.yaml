apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: identity
  labels:
    app.kubernetes.io/name: gateway
    app.kubernetes.io/part-of: platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gateway
        app.kubernetes.io/part-of: platform
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: gateway
          image: ghcr.io/nacfson/platform-auth-gateway:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: GATEWAY_PORT
              value: "8080"
            - name: KEYCLOAK_ISSUER_URL
              value: "http://keycloak-service.identity.svc:8080/realms/platform"
            - name: KEYCLOAK_ADMIN_URL
              value: "http://keycloak-service.identity.svc:8080"
            - name: COOKIE_DOMAIN
              value: ".example.com"
            - name: COOKIE_NAME
              value: "PLATFORM_SESSION"
            - name: GATEWAY_CLIENT_ID
              value: "gateway-client"
            - name: GATEWAY_HMAC_SECRET_FILE
              value: "/var/run/secrets/gateway/hmac"
            - name: GATEWAY_CLIENT_SECRET_FILE
              value: "/var/run/secrets/gateway/client_secret"
            - name: SESSION_REVOCATION_CLIENT_SECRET_FILE
              value: "/var/run/secrets/gateway/session_revocation_secret"
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: gateway-secrets
              mountPath: /var/run/secrets/gateway
              readOnly: true
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
      volumes:
        - name: gateway-secrets
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: identity
  labels:
    app.kubernetes.io/name: gateway
    app.kubernetes.io/part-of: platform
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP
  selector:
    app.kubernetes.io/name: gateway
