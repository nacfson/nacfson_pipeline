apiVersion: v1
kind: ConfigMap
metadata:
  name: keycloak-realm-config
  namespace: identity
  labels:
    app.kubernetes.io/name: keycloak
    app.kubernetes.io/part-of: platform
data:
  platform-realm.json: |
    {
      "realm": "platform",
      "displayName": "Personal Project Platform",
      "enabled": true,
      "registrationAllowed": false,
      "resetPasswordAllowed": false,
      "rememberMe": true,
      "loginWithEmailAllowed": false,
      "duplicateEmailsAllowed": false,
      "sslRequired": "external",
      "identityProviders": [
        {
          "alias": "google",
          "displayName": "Google",
          "providerId": "google",
          "enabled": true,
          "updateProfileFirstLoginMode": "off",
          "trustEmail": true,
          "storeToken": false,
          "addReadTokenRoleOnCreate": false,
          "authenticateByDefault": true,
          "firstBrokerLoginFlowAlias": "first broker login",
          "config": {
            "clientId": "${GOOGLE_CLIENT_ID}",
            "clientSecret": "${GOOGLE_CLIENT_SECRET}",
            "defaultScope": "openid profile email"
          }
        }
      ],
      "clientScopes": [
        {
          "name": "project-pn-audience",
          "description": "Inject project-pn audience into issued access tokens",
          "protocol": "openid-connect",
          "attributes": {
            "include.in.token.scope": "true",
            "display.on.consent.screen": "false"
          },
          "protocolMappers": [
            {
              "name": "project-pn-aud-mapper",
              "protocol": "openid-connect",
              "protocolMapper": "oidc-audience-mapper",
              "consentRequired": false,
              "config": {
                "included.client.audience": "project-pn",
                "id.token.claim": "false",
                "access.token.claim": "true"
              }
            }
          ]
        }
      ],
      "clients": [
        {
          "clientId": "gateway-client",
          "name": "Go Authentication Gateway",
          "enabled": true,
          "publicClient": false,
          "standardFlowEnabled": true,
          "directAccessGrantsEnabled": false,
          "serviceAccountsEnabled": true,
          "clientAuthenticatorType": "client-secret",
          "redirectUris": [
            "https://auth.example.com/oauth/callback",
            "http://localhost:8080/oauth/callback"
          ],
          "webOrigins": ["+"]
        },
        {
          "clientId": "project-pn",
          "name": "Project PN Application",
          "enabled": true,
          "publicClient": false,
          "standardFlowEnabled": true,
          "directAccessGrantsEnabled": false,
          "clientAuthenticatorType": "client-secret",
          "defaultClientScopes": ["web-origins", "role_list", "profile", "email", "project-pn-audience"],
          "redirectUris": [
            "https://pn.example.com/*",
            "http://localhost:8080/*"
          ],
          "webOrigins": ["+"]
        },
        {
          "clientId": "session-revocation-client",
          "name": "Platform Session Revocation Service",
          "enabled": true,
          "publicClient": false,
          "standardFlowEnabled": false,
          "serviceAccountsEnabled": true,
          "clientAuthenticatorType": "client-secret"
        }
      ]
    }
