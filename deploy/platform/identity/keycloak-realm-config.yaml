apiVersion: v1
kind: ConfigMap
metadata:
  name: keycloak-realm-config
  namespace: identity
  labels:
    app.kubernetes.io/name: keycloak
    app.kubernetes.io/part-of: platform
data:
  platform-realm.json: |
    {
        "realm": "platform",
        "displayName": "Personal Project Platform",
        "enabled": true,
        "registrationAllowed": false,
        "resetPasswordAllowed": false,
        "rememberMe": true,
        "loginWithEmailAllowed": false,
        "duplicateEmailsAllowed": false,
        "sslRequired": "external",
        "defaultDefaultClientScopes": [
            "profile",
            "email",
            "roles",
            "web-origins",
            "acr"
        ],
        "defaultOptionalClientScopes": [
            "offline_access"
        ],
        "firstBrokerLoginFlow": "google jit first broker login",
        "authenticatorConfig": [
            {
                "alias": "google-jit-review-profile",
                "config": {
                    "update.profile.on.first.login": "off"
                }
            },
            {
                "alias": "google-jit-create-unique-user",
                "config": {
                    "require.password.update.after.registration": "false"
                }
            }
        ],
        "authenticationFlows": [
            {
                "alias": "google jit first broker login",
                "description": "Non-interactive JIT provisioning for Google SSO (AUTH-01). Creates a Keycloak user on first successful Google login. Does not auto-link by email.",
                "providerId": "basic-flow",
                "topLevel": true,
                "builtIn": false,
                "authenticationExecutions": [
                    {
                        "authenticator": "idp-review-profile",
                        "authenticatorFlow": false,
                        "requirement": "REQUIRED",
                        "priority": 10,
                        "autheticatorFlow": false,
                        "authenticatorConfig": "google-jit-review-profile",
                        "userSetupAllowed": false
                    },
                    {
                        "authenticator": "idp-create-user-if-unique",
                        "authenticatorFlow": false,
                        "requirement": "REQUIRED",
                        "priority": 20,
                        "autheticatorFlow": false,
                        "authenticatorConfig": "google-jit-create-unique-user",
                        "userSetupAllowed": false
                    }
                ]
            }
        ],
        "requiredActions": [
            {
                "alias": "CONFIGURE_TOTP",
                "name": "Configure OTP",
                "providerId": "CONFIGURE_TOTP",
                "enabled": true,
                "defaultAction": false,
                "priority": 10,
                "config": {}
            },
            {
                "alias": "TERMS_AND_CONDITIONS",
                "name": "Terms and Conditions",
                "providerId": "TERMS_AND_CONDITIONS",
                "enabled": false,
                "defaultAction": false,
                "priority": 20,
                "config": {}
            },
            {
                "alias": "UPDATE_PASSWORD",
                "name": "Update Password",
                "providerId": "UPDATE_PASSWORD",
                "enabled": true,
                "defaultAction": false,
                "priority": 30,
                "config": {}
            },
            {
                "alias": "UPDATE_PROFILE",
                "name": "Update Profile",
                "providerId": "UPDATE_PROFILE",
                "enabled": true,
                "defaultAction": false,
                "priority": 40,
                "config": {}
            },
            {
                "alias": "VERIFY_EMAIL",
                "name": "Verify Email",
                "providerId": "VERIFY_EMAIL",
                "enabled": true,
                "defaultAction": false,
                "priority": 50,
                "config": {}
            },
            {
                "alias": "delete_account",
                "name": "Delete Account",
                "providerId": "delete_account",
                "enabled": false,
                "defaultAction": false,
                "priority": 60,
                "config": {}
            },
            {
                "alias": "VERIFY_PROFILE",
                "name": "Verify Profile",
                "providerId": "VERIFY_PROFILE",
                "enabled": false,
                "defaultAction": false,
                "priority": 90,
                "config": {}
            },
            {
                "alias": "delete_credential",
                "name": "Delete Credential",
                "providerId": "delete_credential",
                "enabled": true,
                "defaultAction": false,
                "priority": 100,
                "config": {}
            },
            {
                "alias": "update_user_locale",
                "name": "Update User Locale",
                "providerId": "update_user_locale",
                "enabled": true,
                "defaultAction": false,
                "priority": 1000,
                "config": {}
            }
        ],
        "identityProviders": [
            {
                "alias": "google",
                "displayName": "Google",
                "providerId": "google",
                "enabled": true,
                "updateProfileFirstLoginMode": "off",
                "trustEmail": true,
                "storeToken": false,
                "addReadTokenRoleOnCreate": false,
                "authenticateByDefault": true,
                "linkOnly": false,
                "hideOnLogin": false,
                "firstBrokerLoginFlowAlias": "google jit first broker login",
                "config": {
                    "clientId": "${GOOGLE_CLIENT_ID}",
                    "clientSecret": "${GOOGLE_CLIENT_SECRET}",
                    "defaultScope": "openid profile email",
                    "syncMode": "IMPORT"
                }
            }
        ],
        "identityProviderMappers": [
            {
                "name": "google-username-from-sub",
                "identityProviderAlias": "google",
                "identityProviderMapper": "oidc-username-idp-mapper",
                "config": {
                    "syncMode": "INHERIT",
                    "template": "${ALIAS}.${CLAIM.sub}"
                }
            },
            {
                "name": "google-email",
                "identityProviderAlias": "google",
                "identityProviderMapper": "oidc-user-attribute-idp-mapper",
                "config": {
                    "syncMode": "INHERIT",
                    "claim": "email",
                    "user.attribute": "email"
                }
            },
            {
                "name": "google-given-name",
                "identityProviderAlias": "google",
                "identityProviderMapper": "oidc-user-attribute-idp-mapper",
                "config": {
                    "syncMode": "INHERIT",
                    "claim": "given_name",
                    "user.attribute": "firstName"
                }
            },
            {
                "name": "google-family-name",
                "identityProviderAlias": "google",
                "identityProviderMapper": "oidc-user-attribute-idp-mapper",
                "config": {
                    "syncMode": "INHERIT",
                    "claim": "family_name",
                    "user.attribute": "lastName"
                }
            }
        ],
        "clientScopes": [
            {
                "name": "email",
                "description": "OpenID Connect built-in scope: email",
                "protocol": "openid-connect",
                "attributes": {
                    "include.in.token.scope": "true",
                    "display.on.consent.screen": "true"
                },
                "protocolMappers": [
                    {
                        "name": "email",
                        "protocol": "openid-connect",
                        "protocolMapper": "oidc-usermodel-attribute-mapper",
                        "consentRequired": false,
                        "config": {
                            "user.attribute": "email",
                            "claim.name": "email",
                            "jsonType.label": "String",
                            "id.token.claim": "true",
                            "access.token.claim": "true",
                            "userinfo.token.claim": "true"
                        }
                    },
                    {
                        "name": "email verified",
                        "protocol": "openid-connect",
                        "protocolMapper": "oidc-usermodel-property-mapper",
                        "consentRequired": false,
                        "config": {
                            "user.attribute": "emailVerified",
                            "claim.name": "email_verified",
                            "jsonType.label": "boolean",
                            "id.token.claim": "true",
                            "access.token.claim": "true",
                            "userinfo.token.claim": "true"
                        }
                    }
                ]
            },
            {
                "name": "profile",
                "description": "OpenID Connect built-in scope: profile",
                "protocol": "openid-connect",
                "attributes": {
                    "include.in.token.scope": "true",
                    "display.on.consent.screen": "true"
                },
                "protocolMappers": [
                    {
                        "name": "full name",
                        "protocol": "openid-connect",
                        "protocolMapper": "oidc-full-name-mapper",
                        "consentRequired": false,
                        "config": {
                            "id.token.claim": "true",
                            "access.token.claim": "true",
                            "userinfo.token.claim": "true"
                        }
                    },
                    {
                        "name": "username",
                        "protocol": "openid-connect",
                        "protocolMapper": "oidc-usermodel-attribute-mapper",
                        "consentRequired": false,
                        "config": {
                            "user.attribute": "username",
                            "claim.name": "preferred_username",
                            "jsonType.label": "String",
                            "id.token.claim": "true",
                            "access.token.claim": "true",
                            "userinfo.token.claim": "true"
                        }
                    },
                    {
                        "name": "given name",
                        "protocol": "openid-connect",
                        "protocolMapper": "oidc-usermodel-attribute-mapper",
                        "consentRequired": false,
                        "config": {
                            "user.attribute": "firstName",
                            "claim.name": "given_name",
                            "jsonType.label": "String",
                            "id.token.claim": "true",
                            "access.token.claim": "true",
                            "userinfo.token.claim": "true"
                        }
                    },
                    {
                        "name": "family name",
                        "protocol": "openid-connect",
                        "protocolMapper": "oidc-usermodel-attribute-mapper",
                        "consentRequired": false,
                        "config": {
                            "user.attribute": "lastName",
                            "claim.name": "family_name",
                            "jsonType.label": "String",
                            "id.token.claim": "true",
                            "access.token.claim": "true",
                            "userinfo.token.claim": "true"
                        }
                    }
                ]
            },
            {
                "name": "roles",
                "description": "OpenID Connect scope for add user roles to the access token",
                "protocol": "openid-connect",
                "attributes": {
                    "include.in.token.scope": "false",
                    "display.on.consent.screen": "true"
                },
                "protocolMappers": [
                    {
                        "name": "realm roles",
                        "protocol": "openid-connect",
                        "protocolMapper": "oidc-usermodel-realm-role-mapper",
                        "consentRequired": false,
                        "config": {
                            "multivalued": "true",
                            "userinfo.token.claim": "true",
                            "id.token.claim": "true",
                            "access.token.claim": "true",
                            "claim.name": "realm_access.roles",
                            "jsonType.label": "String"
                        }
                    },
                    {
                        "name": "client roles",
                        "protocol": "openid-connect",
                        "protocolMapper": "oidc-usermodel-client-role-mapper",
                        "consentRequired": false,
                        "config": {
                            "multivalued": "true",
                            "userinfo.token.claim": "true",
                            "id.token.claim": "true",
                            "access.token.claim": "true",
                            "claim.name": "resource_access.${client_id}.roles",
                            "jsonType.label": "String"
                        }
                    }
                ]
            },
            {
                "name": "web-origins",
                "description": "OpenID Connect scope for add allowed web origins to the access token",
                "protocol": "openid-connect",
                "attributes": {
                    "include.in.token.scope": "false",
                    "display.on.consent.screen": "false"
                },
                "protocolMappers": [
                    {
                        "name": "allowed web origins",
                        "protocol": "openid-connect",
                        "protocolMapper": "oidc-allowed-origins-mapper",
                        "consentRequired": false,
                        "config": {}
                    }
                ]
            },
            {
                "name": "acr",
                "description": "OpenID Connect scope for add acr (authentication context class reference) to the token",
                "protocol": "openid-connect",
                "attributes": {
                    "include.in.token.scope": "false",
                    "display.on.consent.screen": "false"
                },
                "protocolMappers": [
                    {
                        "name": "acr loa level",
                        "protocol": "openid-connect",
                        "protocolMapper": "oidc-acr-mapper",
                        "consentRequired": false,
                        "config": {
                            "id.token.claim": "true",
                            "access.token.claim": "true",
                            "userinfo.token.claim": "true"
                        }
                    }
                ]
            },
            {
                "name": "project-pn-audience",
                "description": "Inject project-pn audience into issued access tokens",
                "protocol": "openid-connect",
                "attributes": {
                    "include.in.token.scope": "true",
                    "display.on.consent.screen": "false"
                },
                "protocolMappers": [
                    {
                        "name": "project-pn-aud-mapper",
                        "protocol": "openid-connect",
                        "protocolMapper": "oidc-audience-mapper",
                        "consentRequired": false,
                        "config": {
                            "included.client.audience": "project-pn",
                            "id.token.claim": "false",
                            "access.token.claim": "true"
                        }
                    }
                ]
            }
        ],
        "clients": [
            {
                "clientId": "gateway-client",
                "name": "Go Authentication Gateway",
                "enabled": true,
                "publicClient": false,
                "standardFlowEnabled": true,
                "directAccessGrantsEnabled": false,
                "serviceAccountsEnabled": true,
                "clientAuthenticatorType": "client-secret",
                "secret": "${GATEWAY_CLIENT_SECRET}",
                "defaultClientScopes": [
                    "web-origins",
                    "profile",
                    "email",
                    "roles",
                    "project-pn-audience"
                ],
                "redirectUris": [
                    "https://auth.nacfson.cloud/oauth/callback",
                    "https://auth.example.com/oauth/callback",
                    "http://localhost:8080/oauth/callback"
                ],
                "webOrigins": [
                    "+"
                ]
            },
            {
                "clientId": "project-pn",
                "name": "Project PN Application",
                "enabled": true,
                "publicClient": false,
                "standardFlowEnabled": true,
                "directAccessGrantsEnabled": false,
                "clientAuthenticatorType": "client-secret",
                "secret": "${PROJECT_PN_CLIENT_SECRET}",
                "defaultClientScopes": [
                    "web-origins",
                    "profile",
                    "email",
                    "roles",
                    "project-pn-audience"
                ],
                "redirectUris": [
                    "https://pn.nacfson.cloud/*",
                    "https://pn.example.com/*",
                    "http://localhost:8080/*",
                    "https://auth.nacfson.cloud/oauth/callback",
                    "https://auth.example.com/oauth/callback"
                ],
                "webOrigins": [
                    "+"
                ]
            },
            {
                "clientId": "session-revocation-client",
                "name": "Platform Session Revocation Service",
                "enabled": true,
                "publicClient": false,
                "standardFlowEnabled": false,
                "serviceAccountsEnabled": true,
                "clientAuthenticatorType": "client-secret",
                "secret": "${SESSION_REVOCATION_SECRET}"
            }
        ]
    }
