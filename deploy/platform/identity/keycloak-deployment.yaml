apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  namespace: identity
  labels:
    app.kubernetes.io/name: keycloak
    app.kubernetes.io/part-of: platform
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: keycloak
  template:
    metadata:
      labels:
        app.kubernetes.io/name: keycloak
        app.kubernetes.io/part-of: platform
    spec:
      serviceAccountName: keycloak
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: secret-fetcher
          image: curlimages/curl:8.10.1
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          env:
            - name: VAULT_ADDR
              value: "http://openbao-service.vault.svc:8200"
            - name: VAULT_ROLE
              value: "keycloak"
          command:
            - /bin/sh
            - -c
          args:
            - |
              set -euo pipefail
              echo "Authenticating to Vault via Kubernetes ServiceAccount Token..."
              SA_TOKEN=$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)
              LOGIN_RESP=$(curl -fsSL -X POST "${VAULT_ADDR}/v1/auth/kubernetes/login" \
                -d "{\"jwt\": \"${SA_TOKEN}\", \"role\": \"${VAULT_ROLE}\"}")
              VAULT_TOKEN=$(echo "${LOGIN_RESP}" | sed -n 's/.*"client_token":"\([^"]*\)".*/\1/p')

              echo "Retrieving Keycloak database password..."
              SECRET_JSON=$(curl -fsSL -H "X-Vault-Token: ${VAULT_TOKEN}" "${VAULT_ADDR}/v1/kv/data/database/keycloak-user")
              DB_PASS=$(echo "${SECRET_JSON}" | sed -n 's/.*"password":"\([^"]*\)".*/\1/p')

              mkdir -p /opt/keycloak/conf/secrets
              echo -n "${DB_PASS}" > /opt/keycloak/conf/secrets/keycloak_db_password

              echo "Retrieving Google OAuth credentials..."
              GOOGLE_JSON=$(curl -fsSL -H "X-Vault-Token: ${VAULT_TOKEN}" "${VAULT_ADDR}/v1/kv/data/identity/google-oauth")
              GOOGLE_ID=$(echo "${GOOGLE_JSON}" | sed -n 's/.*"client_id":"\([^"]*\)".*/\1/p')
              GOOGLE_SECRET=$(echo "${GOOGLE_JSON}" | sed -n 's/.*"client_secret":"\([^"]*\)".*/\1/p')
              echo -n "${GOOGLE_ID}" > /opt/keycloak/conf/secrets/google_client_id
              echo -n "${GOOGLE_ID}" > /opt/keycloak/conf/secrets/platform_google_client_id
              echo -n "${GOOGLE_SECRET}" > /opt/keycloak/conf/secrets/google_client_secret
              echo -n "${GOOGLE_SECRET}" > /opt/keycloak/conf/secrets/platform_google_client_secret

              echo "Retrieving Gateway client secret..."
              GW_JSON=$(curl -fsSL -H "X-Vault-Token: ${VAULT_TOKEN}" "${VAULT_ADDR}/v1/kv/data/gateway/client-secret")
              GW_SECRET=$(echo "${GW_JSON}" | sed -n 's/.*"client_secret":"\([^"]*\)".*/\1/p')
              echo -n "${GW_SECRET}" > /opt/keycloak/conf/secrets/gateway_client_secret
              echo -n "${GW_SECRET}" > /opt/keycloak/conf/secrets/platform_gateway_client_secret

              echo "Retrieving Session Revocation client secret..."
              REV_JSON=$(curl -fsSL -H "X-Vault-Token: ${VAULT_TOKEN}" "${VAULT_ADDR}/v1/kv/data/gateway/session-revocation-secret")
              REV_SECRET=$(echo "${REV_JSON}" | sed -n 's/.*"client_secret":"\([^"]*\)".*/\1/p')
              echo -n "${REV_SECRET}" > /opt/keycloak/conf/secrets/session_revocation_secret
              echo -n "${REV_SECRET}" > /opt/keycloak/conf/secrets/platform_session_revocation_secret

              echo "Retrieving Project PN client secret..."
              PN_JSON=$(curl -fsSL -H "X-Vault-Token: ${VAULT_TOKEN}" "${VAULT_ADDR}/v1/kv/data/projects/pn/client-secret")
              PN_SECRET=$(echo "${PN_JSON}" | sed -n 's/.*"client_secret":"\([^"]*\)".*/\1/p')
              echo -n "${PN_SECRET}" > /opt/keycloak/conf/secrets/project_pn_client_secret
              echo -n "${PN_SECRET}" > /opt/keycloak/conf/secrets/platform_project_pn_client_secret

              chmod 0400 /opt/keycloak/conf/secrets/*
              echo "Keycloak secrets and realm client secrets populated into ephemeral storage."
          volumeMounts:
            - name: keycloak-secrets
              mountPath: /opt/keycloak/conf/secrets
      containers:
        - name: keycloak
          image: quay.io/keycloak/keycloak:24.0.5
          command:
            - /bin/sh
            - -c
            - |
              export KC_DB_PASSWORD=$(cat /opt/keycloak/conf/secrets/keycloak_db_password)
              exec /opt/keycloak/bin/kc.sh start --import-realm --vault=file --vault-dir=/opt/keycloak/conf/secrets
          env:
            - name: KC_DB
              value: postgres
            - name: KC_DB_URL
              value: jdbc:postgresql://postgres-service.identity.svc:5432/keycloak
            - name: KC_DB_USERNAME
              value: keycloak_user
            - name: KC_PROXY_HEADERS
              value: xforwarded
            - name: KC_HTTP_ENABLED
              value: "true"
            - name: KC_HEALTH_ENABLED
              value: "true"
            - name: KC_METRICS_ENABLED
              value: "true"
            - name: KC_HOSTNAME_STRICT
              value: "false"
            - name: JAVA_OPTS_APPEND
              value: "-Xms256m -Xmx1200m -XX:MaxRAMPercentage=75"
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: management
              containerPort: 9000
              protocol: TCP
          resources:
            requests:
              cpu: 500m
              memory: 1536Mi
            limits:
              cpu: 500m
              memory: 1536Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          startupProbe:
            httpGet:
              path: /health/live
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 15
          volumeMounts:
            - name: keycloak-secrets
              mountPath: /opt/keycloak/conf/secrets
              readOnly: true
            - name: keycloak-realm-config
              mountPath: /opt/keycloak/data/import/platform-realm.json
              subPath: platform-realm.json
              readOnly: true
      volumes:
        - name: keycloak-secrets
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
        - name: keycloak-realm-config
          configMap:
            name: keycloak-realm-config
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak-service
  namespace: identity
  labels:
    app.kubernetes.io/name: keycloak
    app.kubernetes.io/part-of: platform
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP
  selector:
    app.kubernetes.io/name: keycloak
