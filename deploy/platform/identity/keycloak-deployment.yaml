apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  namespace: identity
  labels:
    app.kubernetes.io/name: keycloak
    app.kubernetes.io/part-of: platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: keycloak
  template:
    metadata:
      labels:
        app.kubernetes.io/name: keycloak
        app.kubernetes.io/part-of: platform
    spec:
      serviceAccountName: keycloak
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: secret-fetcher
          image: curlimages/curl:8.10.1
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          env:
            - name: VAULT_ADDR
              value: "http://openbao-service.vault.svc:8200"
            - name: VAULT_ROLE
              value: "keycloak"
          command:
            - /bin/sh
            - -c
          args:
            - |
              set -euo pipefail
              echo "Authenticating to Vault via Kubernetes ServiceAccount Token..."
              SA_TOKEN=$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)
              LOGIN_RESP=$(curl -fsSL -X POST "${VAULT_ADDR}/v1/auth/kubernetes/login" \
                -d "{\"jwt\": \"${SA_TOKEN}\", \"role\": \"${VAULT_ROLE}\"}")
              VAULT_TOKEN=$(echo "${LOGIN_RESP}" | sed -n 's/.*"client_token":"\([^"]*\)".*/\1/p')

              echo "Retrieving Keycloak database password..."
              SECRET_JSON=$(curl -fsSL -H "X-Vault-Token: ${VAULT_TOKEN}" "${VAULT_ADDR}/v1/kv/data/database/keycloak-user")
              DB_PASS=$(echo "${SECRET_JSON}" | sed -n 's/.*"password":"\([^"]*\)".*/\1/p')

              mkdir -p /opt/keycloak/conf/secrets
              echo -n "${DB_PASS}" > /opt/keycloak/conf/secrets/keycloak_db_password
              chmod 0400 /opt/keycloak/conf/secrets/keycloak_db_password
              echo "Keycloak database secret populated into ephemeral storage."
          volumeMounts:
            - name: keycloak-secrets
              mountPath: /opt/keycloak/conf/secrets
      containers:
        - name: keycloak
          image: quay.io/keycloak/keycloak:24.0.5
          command:
            - /bin/sh
            - -c
            - |
              export KC_DB_PASSWORD=$(cat /opt/keycloak/conf/secrets/keycloak_db_password)
              exec /opt/keycloak/bin/kc.sh start
          env:
            - name: KC_DB
              value: postgres
            - name: KC_DB_URL
              value: jdbc:postgresql://postgres-service.identity.svc:5432/keycloak
            - name: KC_DB_USERNAME
              value: keycloak_user
            - name: KC_PROXY_HEADERS
              value: xforwarded
            - name: KC_HTTP_ENABLED
              value: "true"
            - name: KC_HEALTH_ENABLED
              value: "true"
            - name: KC_METRICS_ENABLED
              value: "true"
            - name: KC_HOSTNAME_STRICT
              value: "false"
            - name: JAVA_OPTS_APPEND
              value: "-Xms256m -Xmx1200m -XX:MaxRAMPercentage=75"
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: management
              containerPort: 9000
              protocol: TCP
          resources:
            requests:
              cpu: 500m
              memory: 1536Mi
            limits:
              cpu: 500m
              memory: 1536Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          startupProbe:
            httpGet:
              path: /health/live
              port: 9000
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 9000
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health/live
              port: 9000
            initialDelaySeconds: 30
            periodSeconds: 15
          volumeMounts:
            - name: keycloak-secrets
              mountPath: /opt/keycloak/conf/secrets
              readOnly: true
      volumes:
        - name: keycloak-secrets
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak-service
  namespace: identity
  labels:
    app.kubernetes.io/name: keycloak
    app.kubernetes.io/part-of: platform
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP
  selector:
    app.kubernetes.io/name: keycloak
