apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - upstream/cert-manager.yaml

patches:
  - target:
      kind: Namespace
      name: cert-manager
    patch: |
      apiVersion: v1
      kind: Namespace
      metadata:
        name: cert-manager
        annotations:
          kustomize.toolkit.fluxcd.io/prune: disabled
        labels:
          app.kubernetes.io/part-of: platform
          name: cert-manager

  - target:
      kind: Deployment
      name: cert-manager
      namespace: cert-manager
    patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: cert-manager
        namespace: cert-manager
      spec:
        template:
          spec:
            containers:
              - name: cert-manager-controller
                resources:
                  requests:
                    cpu: "25m"
                    memory: "96Mi"
                  limits:
                    cpu: "200m"
                    memory: "256Mi"
  - target:
      kind: Deployment
      name: cert-manager-cainjector
      namespace: cert-manager
    patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: cert-manager-cainjector
        namespace: cert-manager
      spec:
        template:
          spec:
            containers:
              - name: cert-manager-cainjector
                resources:
                  requests:
                    cpu: "10m"
                    memory: "64Mi"
                  limits:
                    cpu: "100m"
                    memory: "192Mi"
  - target:
      kind: Deployment
      name: cert-manager-webhook
      namespace: cert-manager
    patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: cert-manager-webhook
        namespace: cert-manager
      spec:
        template:
          spec:
            containers:
              - name: cert-manager-webhook
                resources:
                  requests:
                    cpu: "10m"
                    memory: "32Mi"
                  limits:
                    cpu: "100m"
                    memory: "96Mi"
