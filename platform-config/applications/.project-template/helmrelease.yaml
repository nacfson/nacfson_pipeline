apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: example-project
  namespace: example-project
  labels:
    platform.processmanager.dev/project: example-project
spec:
  interval: 10m
  chart:
    spec:
      chart: ./charts/web-process
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
      interval: 10m
  values:
    project: example-project
    image:
      repository: registry.example.internal/projects/example-project/app
      digest: sha256:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
    port: 8080
    replicas: 1
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 256Mi
    healthCheck:
      path: /healthz
    platform: linux/amd64
    accessPolicy: public
    persistence:
      enabled: false
