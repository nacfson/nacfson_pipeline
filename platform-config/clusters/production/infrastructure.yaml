apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infrastructure
  namespace: flux-system
  labels:
    platform.processmanager.dev/unit: infrastructure
spec:
  interval: 30m
  retryInterval: 2m
  timeout: 10m
  path: ./platform-config/infrastructure
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  healthChecks: []
  decryption:
    provider: sops
    secretRef:
      name: sops-age
