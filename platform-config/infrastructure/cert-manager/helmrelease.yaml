apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager
  namespace: cert-manager
spec:
  interval: 30m
  chart:
    spec:
      chart: cert-manager
      version: v1.21.2
      sourceRef:
        kind: HelmRepository
        name: jetstack
        namespace: cert-manager
      interval: 1h
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    crds:
      enabled: true
    image:
      repository: quay.io/jetstack/cert-manager-controller
      tag: v1.21.2
    webhook:
      image:
        repository: quay.io/jetstack/cert-manager-webhook
        tag: v1.21.2
    cainjector:
      image:
        repository: quay.io/jetstack/cert-manager-cainjector
        tag: v1.21.2
    prometheus:
      enabled: false
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 500m
        memory: 512Mi
