apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
  labels:
    platform.processmanager.dev/unit: infrastructure
spec:
  acme:
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    email: platform-certs@example.com
    privateKeySecretRef:
      name: letsencrypt-staging-account
    solvers:
      - http01:
          ingress:
            class: nginx
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-production
  labels:
    platform.processmanager.dev/unit: infrastructure
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: platform-certs@example.com
    privateKeySecretRef:
      name: letsencrypt-production-account
    solvers:
      - http01:
          ingress:
            class: nginx
