# NetworkPolicies for the identity database.
# Keycloak may reach TCP 5432; every project namespace is denied by default-deny
# plus the absence of an allow rule from project namespaces.
# CNPG initdb/instance pods must reach the Kubernetes API. kube-router evaluates
# after ClusterIP DNAT, so allow both the default-namespace Service path and the
# live ClusterIP / node API endpoint (home-lab k3s).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: keycloak-db-allow-keycloak
  namespace: identity-system
  labels:
    platform.processmanager.dev/component: identity-database
spec:
  podSelector:
    matchLabels:
      cnpg.io/cluster: keycloak-db
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              platform.processmanager.dev/component: keycloak
      ports:
        - protocol: TCP
          port: 5432
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: keycloak-db-allow-operator
  namespace: identity-system
  labels:
    platform.processmanager.dev/component: identity-database
spec:
  podSelector:
    matchLabels:
      cnpg.io/cluster: keycloak-db
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cnpg-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: cloudnative-pg
      ports:
        - protocol: TCP
          port: 8000
        - protocol: TCP
          port: 5432
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: keycloak-db-allow-api-egress
  namespace: identity-system
  labels:
    platform.processmanager.dev/component: identity-database
spec:
  podSelector:
    matchLabels:
      cnpg.io/cluster: keycloak-db
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: default
      ports:
        - protocol: TCP
          port: 443
    - to:
        - ipBlock:
            cidr: 10.43.0.1/32
      ports:
        - protocol: TCP
          port: 443
    - to:
        - ipBlock:
            cidr: 192.168.219.120/32
      ports:
        - protocol: TCP
          port: 6443
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: keycloak-allow-db
  namespace: identity-system
  labels:
    platform.processmanager.dev/component: keycloak
spec:
  podSelector:
    matchLabels:
      platform.processmanager.dev/component: keycloak
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              cnpg.io/cluster: keycloak-db
      ports:
        - protocol: TCP
          port: 5432
