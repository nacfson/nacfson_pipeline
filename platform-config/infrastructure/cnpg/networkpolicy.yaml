# NetworkPolicies for the identity database.
# Keycloak may reach TCP 5432; every project namespace is denied by default-deny
# plus the absence of an allow rule from project namespaces.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: keycloak-db-allow-keycloak
  namespace: identity-system
  labels:
    platform.processmanager.dev/component: identity-database
spec:
  podSelector:
    matchLabels:
      cnpg.io/cluster: keycloak-db
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              platform.processmanager.dev/component: keycloak
      ports:
        - protocol: TCP
          port: 5432
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: keycloak-allow-db
  namespace: identity-system
  labels:
    platform.processmanager.dev/component: keycloak
spec:
  podSelector:
    matchLabels:
      platform.processmanager.dev/component: keycloak
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              cnpg.io/cluster: keycloak-db
      ports:
        - protocol: TCP
          port: 5432
