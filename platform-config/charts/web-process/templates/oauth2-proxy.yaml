{{- include "web-process.validateAccessPolicy" . -}}
{{- if eq .Values.accessPolicy "oidc-protected" }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "web-process.fullname" . }}-oauth2-proxy
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "web-process.labels" . | nindent 4 }}
    app.kubernetes.io/component: oauth2-proxy
spec:
  type: ClusterIP
  selector:
    {{- include "web-process.proxySelectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.oauth2Proxy.port }}
      targetPort: http
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "web-process.fullname" . }}-oauth2-proxy
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "web-process.labels" . | nindent 4 }}
    app.kubernetes.io/component: oauth2-proxy
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "web-process.proxySelectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "web-process.labels" . | nindent 8 }}
        app.kubernetes.io/component: oauth2-proxy
        {{- include "web-process.proxySelectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "web-process.serviceAccountName" . }}
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml .Values.securityContext | nindent 8 }}
      containers:
        - name: oauth2-proxy
          image: {{ include "web-process.proxyImage" . | quote }}
          imagePullPolicy: IfNotPresent
          args:
            - --provider=oidc
            - --oidc-issuer-url={{ .Values.oidc.issuerURL }}
            - --client-id={{ .Values.oidc.clientId }}
            - --redirect-url={{ index .Values.oidc.callbackURIs 0 }}
            - --upstream=http://{{ include "web-process.fullname" . }}.{{ .Release.Namespace }}.svc:{{ .Values.port }}
            - --http-address=0.0.0.0:{{ .Values.oauth2Proxy.port }}
            - --email-domain=*
            - --cookie-secure=true
            - --cookie-httponly=true
            - --cookie-samesite=lax
            - --set-xauthrequest=true
            - --pass-access-token=false
            - --skip-provider-button=true
            - --code-challenge-method=S256
            - --allowed-group={{ .Values.oidc.allowedGroup }}
            - --oidc-groups-claim=groups
            - --reverse-proxy=true
            - --silence-ping-logging=true
          env:
            - name: OAUTH2_PROXY_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.oidc.secretName }}
                  key: client-secret
            - name: OAUTH2_PROXY_COOKIE_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.oidc.secretName }}
                  key: cookie-secret
          ports:
            - name: http
              containerPort: {{ .Values.oauth2Proxy.port }}
          readinessProbe:
            httpGet:
              path: /ping
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /ping
              port: http
            initialDelaySeconds: 5
            periodSeconds: 20
          resources:
            {{- toYaml .Values.oauth2Proxy.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
{{- end }}
