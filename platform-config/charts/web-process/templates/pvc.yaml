{{- include "web-process.validateAccessPolicy" . -}}
{{- if .Values.persistence.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "web-process.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "web-process.labels" . | nindent 4 }}
    platform.processmanager.dev/backup-class: {{ .Values.persistence.backupClass | quote }}
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: {{ .Values.persistence.storageClass }}
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
{{- end }}
